# Signs in a brand-new user (unique email) through the real OTP flow.
# Leaves the app on the onboarding screen (new accounts aren't onboarded).
appId: com.zenflow.app
---
- runScript: ../scripts/new-user.js
# A cold start after clearState outlasts tapOn's default wait on the CI emulator.
- extendedWaitUntil:
    visible:
      id: login.use-email
    timeout: 60000
# Test accounts are full addresses, not student IDs.
- tapOn:
    id: login.use-email
- tapOn:
    id: login.email
- inputText: ${output.email}
- tapOn:
    id: login.submit
- extendedWaitUntil:
    visible:
      id: login.change-email
    timeout: 20000
- runScript:
    file: ../scripts/otp.js
    env:
      EMAIL: ${output.email}
      MAILPIT_URL: ${MAILPIT_URL}
# The hidden OTP input is autofocused; 6 digits auto-submit.
- inputText: ${output.otp}
