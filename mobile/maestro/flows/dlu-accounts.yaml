# DLU Accounts Integration Flow (P1 Extended)
# Tests: Settings → DLU section renders both providers (LMS, PORTAL) with
# rows + status → sign-in sheet opens from Connect.
#
# SCOPE: navigation + state visibility only. Submitting credentials needs
# a fixture provider (E2E_DLU_USERNAME / E2E_DLU_PASSWORD); without one the
# flow stops at the open sheet and backs out via the modal dismiss below.
# Full connect → sync → disconnect is manual until a fixture exists.
# Prerequisites: authenticated onboarded user. INGESTION_ENABLED may be
# false — the section renders regardless.

appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tabs.settings
- assertVisible:
    id: settings.screen

# Section + provider list render
- assertVisible:
    id: settings.dluAccounts.section
- assertVisible:
    id: settings.dluAccounts.list
- assertVisible:
    id: settings.dluAccounts.LMS.row
- assertVisible:
    id: settings.dluAccounts.PORTAL.row

# Status lines render for both providers (connected or not)
- assertVisible:
    id: settings.dluAccounts.LMS.statusText
- assertVisible:
    id: settings.dluAccounts.PORTAL.statusText

# Connect opens the sign-in sheet (credentialed submit is fixture-gated)
- tapOn:
    id: settings.dluAccounts.LMS.connectButton
- assertVisible:
    id: settings.dluAccounts.signInSheet.usernameInput
- assertVisible:
    id: settings.dluAccounts.signInSheet.passwordInput

# Dismiss the sheet so the next flow starts from a clean Settings screen.
# (Swipe-down is the sheet's native dismiss gesture.)
- swipe:
    direction: DOWN
- assertVisible:
    id: settings.dluAccounts.section
