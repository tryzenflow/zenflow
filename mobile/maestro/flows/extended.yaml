# P1 Extended Suite — notification permission + DLU accounts integration.
# Run after the P0 smoke suite passes. Same two-phase login contract as
# smoke.yaml: execute via the runner, never with bare `maestro test`.
#
#   node mobile/maestro/scripts/run-suite.js extended
#
# Prerequisites (in addition to the P0 smoke requirements):
#   - Notification permission state pre-set via:
#       Android: adb shell pm grant/revoke <app-id> android.permission.POST_NOTIFICATIONS
#       iOS:     xcrun simctl privacy booted grant/deny notifications <app-id>
#   - The DLU flow asserts navigation + account states only. Full
#     connect/sync/disconnect needs fixture credentials (E2E_DLU_USERNAME /
#     E2E_DLU_PASSWORD); without them the credentialed steps are skipped and
#     documented as manual.
# Env: MAESTRO_APP_ID, E2E_EMAIL, E2E_RUN_ID, E2E_OTP, E2E_TODAY.

appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: login-verify.yaml
- runFlow:
    file: onboarding.yaml

# ── P1 Flow 1: Notification Permission ──────────────────────────────
- runFlow:
    file: notification-permission.yaml

# ── P1 Flow 2: DLU Accounts Integration ────────────────────────────
- runFlow:
    file: dlu-accounts.yaml

# ── Logout ──────────────────────────────────────────────────────────
- runFlow:
    file: logout.yaml

# Verify clean state
- assertVisible:
    id: auth.login.emailInput
