# Notification Permission Flow (P1 Extended)
# Tests: notification bell reachable from Week → inbox screen opens with
# its list → back to Week. The OS permission prompt itself is NOT driven
# (system UI differs per platform/version); control it before the run:
#
#   Android: adb shell pm grant <app-id> android.permission.POST_NOTIFICATIONS
#            (or revoke to test the denied path)
#   iOS:     xcrun simctl privacy booted grant notifications <app-id>
#            (or deny)
#
# Prerequisites: authenticated onboarded user (extended suite handles it).
# Expected: inbox opens, back returns to Week, denied state never blocks nav.

appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tabs.week

# Bell is pinned top-right over the calendar header
- tapOn:
    id: notifications.bell

# Inbox screen with its list
- assertVisible:
    id: notifications.screen
- assertVisible:
    id: notifications.inbox

# Back to Week
- tapOn:
    id: notifications.backButton
- assertVisible:
    id: tabs.week
