# P0 Smoke Suite — runs all critical paths end-to-end.
#
# Entry point for CI and for scripts/run-suite.js.
# The runner chains login-verify.yaml in front of this file (one maestro
# invocation), so login is DONE and this suite starts at ONBOARDING.
#
# Requires: backend test stack (NODE_ENV=test), MailHog, Expo dev client
# installed, Metro running, E2E_TODAY exported by the runner.
# Env: MAESTRO_APP_ID, E2E_RUN_ID, E2E_TODAY.

appId: ${MAESTRO_APP_ID}
---
# Flow 1: Onboarding (fresh user only)
- runFlow:
    file: onboarding.yaml

# Flow 2: Create Task
- runFlow:
    file: task-create.yaml

# Flow 3: Edit Task (seeded independently of Flow 2)
- runFlow:
    file: task-edit.yaml

# Flow 4: Calendar Week View (seeded independently)
- runFlow:
    file: calendar-week.yaml

# Flow 5: Calendar Month View (seeded independently)
- runFlow:
    file: calendar-month.yaml

# Flow 6: Logout
- runFlow:
    file: logout.yaml

# Verify we're back at login screen (logout verified)
- assertVisible:
    id: auth.login.emailInput
