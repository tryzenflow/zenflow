# Onboarding Flow
# Steps: language → name → DLU (skip) → notifications (skip) →
# timezone → reminder → tags → done summary → Week tab.
# Prerequisites: fresh authenticated user (login-verify just passed).
# Expected: user lands on the Week tab; relaunch skips onboarding.
#
# testID map (all verified against app/(onboarding)/index.tsx):
# continue/skip share one ID across steps: onboarding.continueButton /
# onboarding.skipButton. Reminder values are minutes (15, not "15min").

appId: ${MAESTRO_APP_ID}
---
# Language step
- assertVisible:
    id: onboarding.screen
- tapOn:
    id: onboarding.language.option.en
- tapOn:
    id: onboarding.continueButton

# Name step
- assertVisible:
    id: onboarding.name.input
- tapOn:
    id: onboarding.name.input
- inputText: "E2E User"
- tapOn:
    id: onboarding.continueButton

# DLU step — skip (P1 covers accounts separately)
- tapOn:
    id: onboarding.skipButton

# Notifications step — skip for now (P1 covers the inbox separately)
- tapOn:
    id: onboarding.skipButton

# Timezone step — keep the detected device zone
- assertVisible:
    id: onboarding.timezone.searchInput
- tapOn:
    id: onboarding.timezone.detectedOption
- tapOn:
    id: onboarding.continueButton

# Reminder step — 15 min default
- tapOn:
    id: onboarding.reminder.option.15
- tapOn:
    id: onboarding.continueButton

# Tags step — add one run-scoped custom tag, keep suggestions as-is
- tapOn:
    id: onboarding.tags.input
- inputText: "e2e"
- tapOn:
    id: onboarding.tags.addButton
- tapOn:
    id: onboarding.continueButton

# Done summary — opens the app (footer reuses the continue button ID)
- tapOn:
    id: onboarding.continueButton

# Verify we're on the Week tab
- assertVisible:
    id: tabs.week
