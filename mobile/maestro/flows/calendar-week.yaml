# Calendar Week View Flow
# Tests: Week tab → header → seeded tasks render → swipe to next week →
# seeded next-week task → swipe back.
# Prerequisites: runner seeded "E2E This Week" (today 12:00 UTC) and
# "E2E Next Week" (today+7 12:00 UTC). Independent of Flow 3.
# Expected: week paging works and seeded cards render on their weeks.
#
# Navigation is swipe-driven — the pager has no prev/next buttons.
# The Today pill only renders while off-today, so resetting is optional.

appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tabs.week
- assertVisible:
    id: calendar.week.header

# Reset to today when the pill is showing (no-op otherwise)
- optional:
    - tapOn:
        id: calendar.todayButton

# This week's seeded task renders
- assertVisible:
    id: calendar.taskCard.e2e-this-week

# Page to next week
- swipe:
    direction: LEFT

# Next week's seeded task renders
- assertVisible:
    id: calendar.taskCard.e2e-next-week

# Page back
- swipe:
    direction: RIGHT

# Back on the current week
- assertVisible:
    id: calendar.taskCard.e2e-this-week
