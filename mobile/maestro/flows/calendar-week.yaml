# Calendar Week View Flow
# Tests: Week tab → header → seeded cards render on their days → explicit
# navigation to the seeded next-week day → Today pill returns to today.
# Prerequisites: runner seeded "E2E This Week" (today 12:00) and
# "E2E Next Week" (today+7 12:00) BEFORE login (see scripts/run-suite.js).
# Expected: seeded cards render on their weeks and date navigation works.
#
# Navigation is chip-tap based (calendar.week.day.<yyyy-MM-dd>), not swipe:
# a timeline swipe advances ONE day, and a decisive flick at a week edge
# pages a whole week — so swiping to a fixed fixture day is timing-dependent.
# The day timeline opens scrolled to "now", so each card is scrolled into
# view first (try DOWN — noon may be ahead of now — then UP as fallback).

appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tabs.week
- assertVisible:
    id: calendar.week.header

# Reset to today when the pill is showing (no-op otherwise)
- optional:
    - tapOn:
        id: calendar.todayButton

# This week's seeded task renders (today's noon slot)
- optional:
    - scrollUntilVisible:
        element:
          id: calendar.taskCard.e2e-this-week
        direction: DOWN
        timeout: 3000
- scrollUntilVisible:
    element:
      id: calendar.taskCard.e2e-this-week
    direction: UP
    timeout: 5000

# Navigate to the seeded next-week day via its header chip
- tapOn:
    id: calendar.week.day.${E2E_NEXT_WEEK}

# Next week's seeded task renders (its noon slot)
- optional:
    - scrollUntilVisible:
        element:
          id: calendar.taskCard.e2e-next-week
        direction: DOWN
        timeout: 3000
- scrollUntilVisible:
    element:
      id: calendar.taskCard.e2e-next-week
    direction: UP
    timeout: 5000

# The Today pill (visible now — we are off-today) returns to today
- tapOn:
    id: calendar.todayButton

# Back on the current week
- optional:
    - scrollUntilVisible:
        element:
          id: calendar.taskCard.e2e-this-week
        direction: DOWN
        timeout: 3000
- scrollUntilVisible:
    element:
      id: calendar.taskCard.e2e-this-week
    direction: UP
    timeout: 5000
