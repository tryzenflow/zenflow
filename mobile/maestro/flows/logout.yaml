# Logout Flow
# Tests: Settings tab → sign out → login screen → relaunch → still logged out.
# Prerequisites: authenticated onboarded user.
# Expected: session cleared, login screen persists across relaunch.
#
# Sign-out applies immediately — there is no confirm dialog.

appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tabs.settings
- assertVisible:
    id: settings.screen

# Sign out needs a scroll on small screens — tapOn auto-scrolls to it
- tapOn:
    id: settings.logoutButton

# Back on login
- assertVisible:
    id: auth.login.emailInput

# Relaunch — must still be logged out
- launchApp
- assertVisible:
    id: auth.login.emailInput
