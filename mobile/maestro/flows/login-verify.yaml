# Login Phase 2/2 — enter OTP and verify
# Enters the OTP the runner fetched from MailHog into E2E_OTP.
# Run by the runner AFTER get-otp.js, chained with the suite in ONE
# maestro invocation — the app is still sitting on the OTP screen from
# login-request.yaml, so there is NO launchApp and nothing restarts in
# between.
#
# Expected: fresh users land on onboarding; re-runs on an onboarded user
# land on the Week tab (covered by the optional branch).
# Env: MAESTRO_APP_ID, E2E_OTP.

appId: ${MAESTRO_APP_ID}
---
# App is already on OTP screen from login-request.yaml — NO launchApp!
- tapOn:
    id: auth.login.otpBoxes
- inputText: ${E2E_OTP}

# Fresh test users always onboard (the runner resets before every run),
# so reaching onboarding proves the OTP was accepted.
- assertVisible:
    id: onboarding.screen
