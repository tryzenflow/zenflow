# Create Task Flow
# Tests: FAB tap → form opens → fill title/type/duration/deadline →
# save → optional slot pick → verify on calendar.
# Prerequisites: onboarded user on the Week tab.
# Expected: "E2E Focus Block <run-id>" renders as a calendar card.
# The card testID is the slugified title (see lib/test-ids.ts).

appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tabs.week
- tapOn:
    id: tasks.newButton

# Task form opens
- assertVisible:
    id: tasks.form.screen
- assertVisible:
    id: tasks.form.titleInput
- tapOn:
    id: tasks.form.titleInput
- inputText: "E2E Focus Block ${E2E_RUN_ID}"

# Flexible task type (default, re-tap is a harmless no-op)
- tapOn:
    id: tasks.form.sessionTypeTab.TASK

# Duration 60 → 90 min
- tapOn:
    id: tasks.form.durationStepper.increment
- tapOn:
    id: tasks.form.durationStepper.increment

# Deadline tomorrow — keeps placement inside the visible week
- tapOn:
    id: tasks.form.deadlineChip.tomorrow

# Save
- tapOn:
    id: tasks.form.saveButton

# Divergent placement opens the slot picker: keep the primary slot.
# Absent when the engine placed the task directly.
- optional:
    - tapOn:
        id: tasks.scheduler.pickPrimaryButton

# The app jumps to the placed day — the new card is showing there.
- assertVisible:
    id: calendar.taskCard.e2e-focus-block-${E2E_RUN_ID}
