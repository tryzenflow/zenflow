# Create Task Flow Test

appId: ${maestro.config.appId}
---
- name: "Create Task - Single Session"
  tags: [smoke, create-task]
  steps:
    - runFlow: "helpers/common.yaml#Ensure Clean State"
    - runFlow:
        file: "helpers/otp.yaml"
        env:
          EMAIL: "test@example.com"
    - runFlow: "helpers/otp.yaml#Enter OTP"
    - assertVisible:
        id: "create-task-fab"
        timeout: 10000
    - assertVisible:
        id: "calendar-week-header"

    # Tap FAB to create new task
    - tapOn:
        id: "create-task-fab"
    - assertVisible:
        id: "task-type-tabs"
        timeout: 5000
    - assertVisible:
        text: "TASK"

    # Fill title with unique name
    - tapOn:
        id: "task-title-input"
    - inputText: "Study for exam ${TIMESTAMP}"
    - runScript: |
        await setOutput('TASK_TITLE', "Study for exam " + Date.now())

    # Verify TASK type is selected
    - assertVisible:
        id: "task-type-tabs"
        child:
          text: "TASK"

    # Adjust duration to 90 min
    - tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"
    - tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"
    - tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"
    - tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"
    - tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"
    - tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"

    # Set session count to 3 (series)
    - tapOn:
        id: "task-session-count"
    - swipe:
        start: 0,50
        end: 80,50
        duration: 500
    - wait: 500

    # Set deadline to 7 days from now
    - tapOn:
        id: "task-deadline-chip"
    - wait: 1000
    - tapOn:
        text: "7 days"
    - waitForAnimationToEnd

    # Add reminder - 15 min before
    - tapOn:
        id: "task-reminder-field"
    - wait: 500
    - tapOn:
        id: "reminder-preset-15min"
    - waitForAnimationToEnd

    # Add tag
    - tapOn:
        id: "task-tag-autocomplete"
    - inputText: "study"
    - wait: 1000
    - tapOn:
        text: "study"

    # Add description
    - tapOn:
        id: "task-description-field"
    - inputText: "Focus on chapters 1-3"
    - waitForAnimationToEnd

    # Tap submit
    - tapOn:
        id: "task-submit-button"
    - waitForAnimationToEnd
    - wait: 3000

    # Handle divergent slot picker if shown
    - optional: true
      assertVisible:
        id: "slot-pick-sheet"
        timeout: 5000
    - optional: true
      tapOn:
        id: "slot-pick-primary"
    - optional: true
      waitForAnimationToEnd
      wait: 2000

    # Verify task appears on calendar
    - assertVisible:
        text: "Study for exam"
        timeout: 10000

---
- name: "Create Task - Series (Multiple Sessions)"
  tags: [create-task, series]
  steps:
    - runFlow: "helpers/common.yaml#Ensure Clean State"
    - runFlow:
        file: "helpers/otp.yaml"
        env:
          EMAIL: "test@example.com"
    - runFlow: "helpers/otp.yaml#Enter OTP"
    - assertVisible:
        id: "create-task-fab"
        timeout: 10000

    - tapOn:
        id: "create-task-fab"
    - assertVisible:
        id: "task-type-tabs"

    - tapOn:
        id: "task-title-input"
    - inputText: "Exam prep series ${TIMESTAMP}"
    - runScript: |
        await setOutput('TASK_TITLE', "Exam prep series " + Date.now())

    # Set duration to 60 min
    - repeat: 3
      tapOn:
        id: "task-duration-stepper"
        child:
          accessibilityLabel: "Increment"

    # Set session count to 3
    - tapOn:
        id: "task-session-count"
    - swipe:
        start: 0,50
        end: 80,50
        duration: 500

    # Set deadline to 14 days
    - tapOn:
        id: "task-deadline-chip"
    - wait: 1000
    - tapOn:
        text: "14 days"
    - waitForAnimationToEnd

    # Add tag
    - tapOn:
        id: "task-tag-autocomplete"
    - inputText: "exam"
    - wait: 1000
    - tapOn:
        text: "exam"

    - tapOn:
        id: "task-submit-button"
    - waitForAnimationToEnd
    - wait: 3000

    # Handle series slot picker if shown
    - optional: true
      assertVisible:
        id: "series-slot-pick-sheet"
        timeout: 5000
    - optional: true
      tapOn:
        id: "series-slot-pick-keep-all"
    - optional: true
      waitForAnimationToEnd
      wait: 2000

    # Verify series appears on calendar
    - assertVisible:
        text: "Exam prep series"
        timeout: 10000
    - assertVisible:
        text: "3 sittings"