# Login/OTP Flow Test

appId: ${maestro.config.appId}
---
- name: "Login Flow - Happy Path"
  tags: [smoke, login]
  steps:
    - runFlow: "helpers/common.yaml#Ensure Clean State"
    - runFlow:
        file: "helpers/otp.yaml"
        env:
          EMAIL: "test@example.com"
    - runFlow: "helpers/otp.yaml#Enter OTP"
    - assertVisible:
        id: "create-task-fab"
        timeout: 10000
    - assertVisible:
        id: "calendar-week-header"

---
- name: "Login Flow - Invalid Email"
  tags: [login, negative]
  steps:
    - runFlow: "helpers/common.yaml#Reset App"
    - tapOn:
        id: "login-email-input"
    - inputText: "invalid-email"
    - tapOn:
        id: "login-send-otp-button"
    - assertVisible:
        text: "Invalid email address"
        timeout: 5000

---
- name: "Login Flow - Wrong OTP"
  tags: [login, negative]
  steps:
    - runFlow: "helpers/common.yaml#Reset App"
    - tapOn:
        id: "login-email-input"
    - inputText: "test@example.com"
    - tapOn:
        id: "login-send-otp-button"
    - wait: 3000
    - runFlow: "helpers/otp.yaml#Get Latest OTP"
    - runScript: |
        const otp = await getOutput('OTP_CODE')
        // Corrupt the OTP
        const wrongOtp = otp.split('').reverse().join('')
        for (const digit of wrongOtp) {
          await driver.pressKey(digit)
        }
    - waitForAnimationToEnd
    - assertVisible:
        text: "Failed to verify OTP"
        timeout: 5000

---
- name: "Login Flow - Change Email"
  tags: [login]
  steps:
    - runFlow: "helpers/common.yaml#Reset App"
    - tapOn:
        id: "login-email-input"
    - inputText: "first@example.com"
    - tapOn:
        id: "login-send-otp-button"
    - wait: 2000
    - tapOn:
        id: "login-change-email"
    - assertVisible:
        id: "login-email-input"
    - inputText: "second@example.com"
    - tapOn:
        id: "login-send-otp-button"
    - wait: 2000
    - runFlow: "helpers/otp.yaml#Get Latest OTP"
    - runFlow: "helpers/otp.yaml#Enter OTP"
    - assertVisible:
        id: "create-task-fab"