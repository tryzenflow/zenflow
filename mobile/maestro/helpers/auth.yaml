# Authentication Helpers
# Reusable YAML snippets for auth flows. IDs verified against
# app/(auth)/login.tsx (auth.login.*) and app/(app)/settings.tsx.
# NOTE: sign-out applies immediately — there is no confirm dialog.

---
# Login with email and OTP
- name: "login"
  parameters:
    - email
    - otp
  commands:
    - tapOn:
        id: auth.login.emailInput
    - inputText: ${email}
    - tapOn:
        id: auth.login.sendOtpButton
    - tapOn:
        id: auth.login.otpBoxes
    - inputText: ${otp}

# Request OTP only (for resend testing)
- name: "requestOtp"
  parameters:
    - email
  commands:
    - tapOn:
        id: auth.login.emailInput
    - inputText: ${email}
    - tapOn:
        id: auth.login.sendOtpButton

# Change email during OTP stage
- name: "changeEmail"
  commands:
    - tapOn:
        id: auth.login.changeEmailLink

# Resend OTP
- name: "resendOtp"
  commands:
    - tapOn:
        id: auth.login.resendButton

# Logout from settings
- name: "logout"
  commands:
    - tapOn:
        id: tabs.settings
    - tapOn:
        id: settings.logoutButton
