# OTP retrieval from MailHog API

---
# Get latest OTP from MailHog
- name: "Get Latest OTP"
  description: "Fetch 6-digit OTP from MailHog for given email"
  steps:
    - runScript: |
        const email = await getEnv('EMAIL') || 'test@example.com'
        const response = await fetch('http://localhost:8025/api/v2/messages')
        const data = await response.json()
        const messages = data.items || []
        const emailMsg = messages.find(m =>
          m.Content.Headers.To && m.Content.Headers.To[0].includes(email)
        )
        if (!emailMsg) {
          throw new Error('No email found for ' + email)
        }
        const body = emailMsg.Content.Body
        const otpMatch = body.match(/(\d{6})/)
        if (!otpMatch) {
          throw new Error('No OTP found in email')
        }
        await setOutput('OTP_CODE', otpMatch[1])

---
# Request OTP and get code
- name: "Request OTP And Get Code"
  description: "Enter email, request OTP, fetch from MailHog"
  steps:
    - tapOn:
        id: "login-email-input"
    - inputText: "${env.EMAIL}"
    - tapOn:
        id: "login-send-otp-button"
    - waitForAnimationToEnd
    - wait: 3000
    - runFlow: "Get Latest OTP"
    - wait: 1000

---
# Enter OTP code
- name: "Enter OTP"
  description: "Input 6-digit OTP from output"
  steps:
    - runScript: |
        const otp = await getOutput('OTP_CODE')
        for (const digit of otp) {
          await driver.pressKey(digit)
        }
    - waitForAnimationToEnd
    - wait: 2000