# Navigation Helpers
# Reusable YAML snippets for tab navigation and common paths.
# Tab IDs come from components/tab-bar.tsx; calendar IDs from
# components/calendar/*; form IDs from components/tasks/*.

---
# Navigate to Week tab
- name: "goToWeek"
  commands:
    - tapOn:
        id: tabs.week
    - assertVisible:
        id: calendar.week.header

# Navigate to Month tab
- name: "goToMonth"
  commands:
    - tapOn:
        id: tabs.month
    - assertVisible:
        id: calendar.month.grid

# Navigate to Settings tab
- name: "goToSettings"
  commands:
    - tapOn:
        id: tabs.settings
    - assertVisible:
        id: settings.screen

# Open task creation FAB
- name: "openTaskCreate"
  commands:
    - tapOn:
        id: tasks.newButton
    - assertVisible:
        id: tasks.form.titleInput

# Open task by card slug (slugified title — see lib/test-ids.ts)
- name: "openTask"
  parameters:
    - taskId
  commands:
    - tapOn:
        id: calendar.taskCard.${taskId}
    - assertVisible:
        id: tasks.form.titleInput

# Go back (dismiss modal/sheet)
- name: "goBack"
  commands:
    - pressKey:
        key: BACK
