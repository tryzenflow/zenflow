name: zenflow-test
services:
  postgres:
    container_name: zenflow-test-db
    image: postgres:18.4-alpine
    ports:
      - "5433:5432"
    volumes:
      - /data/postgres:/data/postgres
    env_file:
      - .env.test
    networks:
      - db

  storage:
    container_name: zenflow-storage-test
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data --console-address ":9001"
    ports:
      - "9010:9000"
    volumes:
      - storage_data:/data
    env_file:
      - .env.test
    networks:
      - storage

  # Queue e2e stack (test/queue-flow.e2e-spec.ts): `docker compose --profile queue
  # -f compose.test.yml up -d`. Cache and rate-limit use 7379/7380 (the stack
  # overrides CACHE_URL and RATE_LIMIT_CACHE_URL for its processes); queue/pubsub
  # use 7381/7382, so nothing clashes with dev's 6379-6382 or the main e2e stack.
  redis:
    container_name: zenflow-test-cache
    profiles: ["queue"]
    image: redis:8.8.0-alpine
    ports:
      - "7379:6379"

  redis-ratelimit:
    container_name: zenflow-test-cache-ratelimit
    profiles: ["queue"]
    image: redis:8.8.0-alpine
    ports:
      - "7380:6379"

  redis-queue:
    container_name: zenflow-test-cache-queue
    profiles: ["queue"]
    image: redis:8.8.0-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    ports:
      - "7381:6379"

  redis-pubsub:
    container_name: zenflow-test-cache-pubsub
    profiles: ["queue"]
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "7382:6379"

  mail:
    container_name: zenflow-test-mail
    profiles: ["queue"]
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

networks:
  db:
    driver: bridge
  storage:
    driver: bridge

volumes:
  storage_data:
