name: zenflow-prod
services:
  api:
    container_name: zenflow-api-prod
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: zenflow-api:2.1.0
    expose:
      - "5000"
    networks:
      - edge
      - db
      - cache
      - ratelimit
      - bandit
      - mail
      - o11y
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-ratelimit:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env.prod

  bandit:
    container_name: zenflow-bandit-prod
    build: ../services/bandit
    expose:
      - "8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - bandit
      - o11y

  migrations:
    container_name: zenflow-db-migration-prod
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: zenflow-api:2.1.0
    networks:
      - db
      - egress
    command: pnpm prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod

  postgres:
    container_name: zenflow-db-prod
    image: postgres:16-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - docker.prod.env
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: zenflow-cache-prod
    image: redis:8.8.0-alpine
    expose:
      - "6379"
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-cache-ratelimit-prod
    image: redis:8.8.0-alpine
    expose:
      - "6379"
    networks:
      - ratelimit

  # --- Observability stack (see observability/README.md) --------------------
  # Receives OTLP/HTTP from the API (src/tracing.ts) and the bandit service on
  # :4318, fans traces -> Tempo, metrics -> Prometheus (scrape :8889),
  # logs -> Loki. .env.prod must set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318.
  otel-collector:
    container_name: zenflow-otel-collector-prod
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
    networks:
      - o11y
    depends_on:
      - tempo
      - loki

  # Traces. Metrics-generator remote-writes span metrics + the service graph
  # into Prometheus.
  tempo:
    container_name: zenflow-tempo-prod
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
    networks:
      - o11y

  # Logs. Fed by Alloy (container stdout) and by the collector (app OTLP logs).
  loki:
    container_name: zenflow-loki-prod
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - o11y

  # Ships every container's stdout/stderr to Loki, tagged by compose service.
  alloy:
    container_name: zenflow-alloy-prod
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - o11y
    depends_on:
      - loki

  # Metrics. Scrapes the collector (app), node-exporter (host), cAdvisor
  # (per-container), and accepts remote-write from Tempo.
  prometheus:
    container_name: zenflow-prometheus-prod
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage,native-histograms
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - o11y

  node-exporter:
    container_name: zenflow-node-exporter-prod
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - o11y

  cadvisor:
    container_name: zenflow-cadvisor-prod
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # On a cgroup v2 host, cAdvisor otherwise runs in its own private cgroup
    # namespace and can only see its own cgroup — every container_* series
    # for sibling containers comes back empty even though the target is up.
    #
    # Also needs the host's Docker daemon on the classic overlay2 graphdriver,
    # not the containerd-snapshotter image store Docker Engine defaults new
    # installs to (`docker info` → Driver Type: io.containerd.snapshotter.v1):
    # cAdvisor's Docker reader can't resolve a container's read-write layer
    # under that layout ("failed to identify the read-write layer ID ...") and
    # every container_* series comes back with no name/image label. Set
    # `{"features": {"containerd-snapshotter": false}}` in the host's
    # /etc/docker/daemon.json and restart dockerd if so.
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - o11y

  # Dashboards + Explore. Bound to loopback only — reach it with an SSH tunnel
  # or put it behind Caddy with auth. Anonymous access is OFF here (unlike the
  # standalone compose.observability.yml).
  grafana:
    container_name: zenflow-grafana-prod
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
      GF_LOG_LEVEL: warn
      # Server-side PNG rendering (panel/report exports, alert images).
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - o11y
    depends_on:
      - prometheus
      - tempo
      - loki

  grafana-renderer:
    container_name: zenflow-grafana-renderer-prod
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      RENDERING_MODE: default
    expose:
      - "8081"
    networks:
      - o11y

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge

  mail:
    container_name: zenflow-mail-staging
    image: mailhog/mailhog:v1.0.1
    expose:
      - "1025"
    ports:
      - 8025:8025
    networks:
      - mail

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  db:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
  ratelimit:
    driver: bridge
    internal: true
  bandit:
    driver: bridge
  o11y:
    driver: bridge
  mail:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads:
  tempo_data:
  loki_data:
  alloy_data:
  prometheus_data:
  grafana_data:
