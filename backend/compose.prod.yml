name: zenflow-prod
services:
  api:
    container_name: zenflow-api-prod
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:0.0.0}
    expose:
      - "5000"
    networks:
      - edge
      - db
      - cache
      - ratelimit
      - bandit
      - mail
      - o11y
      - storage
    volumes:
      - ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api:/run/secrets/zenflow:ro
      # Legacy local uploads; kept mounted only until scripts/migrate-files-to-s3.ts has run.
      - uploads:/app/uploads
    depends_on:
      storage:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env.prod
      # Written by ops/vault/render-secrets.sh when SECRETS_PROVIDER=vault; absent otherwise.
      - path: ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api/files.env
        required: false

  bandit:
    container_name: zenflow-bandit-prod
    build: ../services/bandit
    image: ${ZENFLOW_BANDIT_IMAGE:-zenflow-bandit:latest}
    expose:
      - "8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # The image only reads plain env vars; reuse the API's *_FILE expander and
    # keep the image CMD (overriding entrypoint resets it).
    entrypoint: ["docker-entrypoint.sh"]
    command: ["uv", "run", "--no-dev", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/bandit/files.env
        required: false
    volumes:
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/bandit:/run/secrets/zenflow:ro
    networks:
      - bandit
      - o11y

  migrations:
    container_name: zenflow-db-migration-prod
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:0.0.0}
    networks:
      - db
      - egress
    command: pnpm prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
      # Written by ops/vault/render-secrets.sh when SECRETS_PROVIDER=vault; absent otherwise.
      - path: ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api/files.env
        required: false
    volumes:
      - ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api:/run/secrets/zenflow:ro

  postgres:
    container_name: zenflow-db-prod
    # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the volume mounts one level up.
    image: postgres:18.4-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env.prod
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sessions + OTP. Must NOT evict: losing keys logs users out. AOF keeps them across restarts.
  redis:
    container_name: zenflow-cache-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - cache
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Rate-limit counters only (ADR-0005): disposable, so LRU eviction + RDB snapshot
  # (every 15 s when >= 1 key changed) and no AOF. Keep separate from `redis`.
  redis-ratelimit:
    container_name: zenflow-cache-ratelimit-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "15 1"
      - --appendonly
      - "no"
    volumes:
      - redis_ratelimit_data:/data
    expose:
      - "6379"
    networks:
      - ratelimit
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Observability stack (see observability/README.md) --------------------
  # Receives OTLP/HTTP from the API (src/tracing.ts) and the bandit service on
  # :4318, fans traces -> Tempo, metrics -> Prometheus (scrape :8889),
  # logs -> Loki. .env.prod must set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318.
  otel-collector:
    container_name: zenflow-otel-collector-prod
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
    networks:
      - o11y
    depends_on:
      - tempo
      - loki

  # Traces. Metrics-generator remote-writes span metrics + the service graph
  # into Prometheus.
  tempo:
    container_name: zenflow-tempo-prod
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
    networks:
      - o11y

  # Logs. Fed by Alloy (container stdout) and by the collector (app OTLP logs).
  loki:
    container_name: zenflow-loki-prod
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - o11y

  # Ships every container's stdout/stderr to Loki, tagged by compose service.
  alloy:
    container_name: zenflow-alloy-prod
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - o11y
    depends_on:
      - loki

  # Metrics. Scrapes the collector (app), node-exporter (host), cAdvisor
  # (per-container), and accepts remote-write from Tempo.
  prometheus:
    container_name: zenflow-prometheus-prod
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage,native-histograms
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - o11y

  node-exporter:
    container_name: zenflow-node-exporter-prod
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - o11y

  cadvisor:
    container_name: zenflow-cadvisor-prod
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - o11y

  # Dashboards + Explore. Bound to loopback only — reach it with an SSH tunnel
  # or put it behind Caddy with auth. Anonymous access is OFF.
  grafana:
    container_name: zenflow-grafana-prod
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
      GF_LOG_LEVEL: warn
      # Server-side PNG rendering (panel/report exports, alert images).
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - o11y
    depends_on:
      - prometheus
      - tempo
      - loki

  grafana-renderer:
    container_name: zenflow-grafana-renderer-prod
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      RENDERING_MODE: default
    expose:
      - "8081"
    networks:
      - o11y

  caddy:
    image: caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge

  storage:
    container_name: zenflow-storage-prod
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data
    expose:
      - "9000"
    volumes:
      - storage_data:/data
    env_file:
      - .env.prod
    networks:
      - storage

  # HashiCorp Vault (OSS, file storage). Secrets store for SECRETS_PROVIDER=vault;
  # see docs/ops/secrets.md. Starts sealed: init/unseal by hand after every restart.
  # Not reachable from other containers' networks and published on loopback only.
  vault:
    container_name: zenflow-vault-prod
    image: hashicorp/vault:1.20.4
    restart: unless-stopped
    # Config lives outside /vault/config: the image entrypoint already passes
    # -config=/vault/config for `server`, and a second file there duplicates the listener.
    command: ["server", "-config=/vault/custom/config.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./ops/vault/config.hcl:/vault/custom/config.hcl:ro
    networks:
      - vault
    healthcheck:
      # sealedcode/uninitcode=200 so a sealed or not-yet-initialised Vault still
      # counts as "process is up" (it must be unsealed by a human, not by compose).
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  db:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
  ratelimit:
    driver: bridge
    internal: true
  bandit:
    driver: bridge
  o11y:
    driver: bridge
  mail:
    driver: bridge
  storage:
    driver: bridge
    internal: true
  vault:
    driver: bridge

volumes:
  storage_data:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads:
  tempo_data:
  loki_data:
  alloy_data:
  prometheus_data:
  grafana_data:
  vault_data:
  redis_data:
  redis_ratelimit_data:
