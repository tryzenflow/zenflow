name: zenflow-prod
services:
  # HTTP only (ADR-0011): no crons, ticker or reminder timers, so replicas can be
  # scaled freely. All scheduled work runs in `watcher`, queue consumers in `worker-*`.
  #
  # Blue-green (ADR-0013): `api` and `bandit` are templates only (never started;
  # the `template` profile is never enabled). The app tier runs as api-blue/api-green
  # and bandit-blue/bandit-green, driven by scripts/deploy/deploy.sh. Queue roles and
  # `migrations` use the newest tag (ZENFLOW_API_IMAGE).
  api:
    profiles: ["template"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:0.1.0-beta.0}
    expose:
      - "8000"
    networks:
      - edge
      - db
      - cache
      - ratelimit
      - queue
      - pubsub
      - bandit
      - mail
      - o11y
      - storage
    volumes:
      - ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api:/run/secrets/zenflow:ro
      # Legacy local uploads; kept mounted only until scripts/migrate-files-to-s3.ts has run.
      - uploads:/app/uploads
    depends_on:
      storage:
        condition: service_started
      postgres:
        condition: service_healthy
      session-redis:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-killswitch:
        condition: service_healthy
      redis-pubsub:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env.prod
      # Written by ops/vault/render-secrets.sh when SECRETS_PROVIDER=vault; absent otherwise.
      - path: ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api/files.env
        required: false
    environment:
      ROLE: api
    deploy:
      replicas: 2

  api-blue:
    extends:
      service: api
    profiles: !reset []
    image: ${ZENFLOW_API_IMAGE_BLUE:-${ZENFLOW_API_IMAGE:-zenflow-api:0.1.0-beta.0}}
    mem_limit: 1g
    environment:
      BANDIT_SERVICE_URL: http://bandit-blue:8000
    depends_on:
      bandit-blue:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  api-green:
    extends:
      service: api
    profiles: !reset []
    image: ${ZENFLOW_API_IMAGE_GREEN:-${ZENFLOW_API_IMAGE:-zenflow-api:0.1.0-beta.0}}
    mem_limit: 1g
    environment:
      BANDIT_SERVICE_URL: http://bandit-green:8000
    depends_on:
      bandit-green:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Queue roles (ADR-0007, ADR-0011). Each serves only GET /health on :5001.
  # `watcher` is the only cron runner (ingestion ticker, reminder sweep,
  # retained-sessions, matrix decay): exactly one replica. The consumers scale
  # independently (`replicas`), except that fetch concurrency is kept low to be
  # polite to DLU.
  # Enqueues work; consumes nothing.
  watcher:
    extends:
      service: api
    profiles: !reset []
    container_name: zenflow-watcher-prod
    restart: unless-stopped
    environment:
      ROLE: watcher
      BANDIT_SERVICE_URL: http://bandit-${ZENFLOW_ACTIVE_COLOUR:-blue}:8000
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes `portal-fetch`.
  worker-portal:
    extends:
      service: api
    profiles: !reset []
    container_name: zenflow-worker-portal-prod
    restart: unless-stopped
    environment:
      ROLE: worker-portal
      BANDIT_SERVICE_URL: http://bandit-${ZENFLOW_ACTIVE_COLOUR:-blue}:8000
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes `lms-fetch`.
  worker-lms:
    extends:
      service: api
    profiles: !reset []
    container_name: zenflow-worker-lms-prod
    restart: unless-stopped
    environment:
      ROLE: worker-lms
      BANDIT_SERVICE_URL: http://bandit-${ZENFLOW_ACTIVE_COLOUR:-blue}:8000
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes `notify`: push, email, reminders.
  worker-notify:
    extends:
      service: api
    profiles: !reset []
    container_name: zenflow-worker-notify-prod
    restart: unless-stopped
    environment:
      ROLE: worker-notify
      BANDIT_SERVICE_URL: http://bandit-${ZENFLOW_ACTIVE_COLOUR:-blue}:8000
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  bandit:
    profiles: ["template"]
    container_name: zenflow-bandit-prod
    build: ../services/bandit
    image: ${ZENFLOW_BANDIT_IMAGE:-zenflow-bandit:latest}
    expose:
      - "8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # The image only reads plain env vars; reuse the API's *_FILE expander and
    # keep the image CMD (overriding entrypoint resets it).
    entrypoint: ["docker-entrypoint.sh"]
    command: ["uv", "run", "--no-dev", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/bandit/files.env
        required: false
    volumes:
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/bandit:/run/secrets/zenflow:ro
    networks:
      - bandit
      - o11y

  bandit-blue:
    extends:
      service: bandit
    profiles: !reset []
    container_name: zenflow-bandit-prod-blue
    image: ${ZENFLOW_BANDIT_IMAGE_BLUE:-${ZENFLOW_BANDIT_IMAGE:-zenflow-bandit:latest}}

  bandit-green:
    extends:
      service: bandit
    profiles: !reset []
    container_name: zenflow-bandit-prod-green
    image: ${ZENFLOW_BANDIT_IMAGE_GREEN:-${ZENFLOW_BANDIT_IMAGE:-zenflow-bandit:latest}}

  migrations:
    container_name: zenflow-db-migration-prod
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:0.1.0-beta.0}
    networks:
      - db
      - egress
    command: pnpm prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
      # Written by ops/vault/render-secrets.sh when SECRETS_PROVIDER=vault; absent otherwise.
      - path: ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api/files.env
        required: false
    volumes:
      - ${ZENFLOW_SECRETS_DIR:-/run/zenflow/prod}/api:/run/secrets/zenflow:ro

  postgres:
    container_name: zenflow-db-prod
    # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the volume mounts one level up.
    image: postgres:18.4-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env.prod
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate cron process (busybox crond): encrypted pg_dump to S3 plus a restore test.
  # Prod: every 3 h, real S3 (leave BACKUP_S3_ENDPOINT unset); also snapshots Vault file storage.
  # Keys come from .env.prod: BACKUP_S3_*, BACKUP_AGE_RECIPIENT, BACKUP_AGE_IDENTITY. See docs/ops/backups.md.
  backup:
    container_name: zenflow-backup-prod
    image: postgres:18.4-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/opt/backup/entrypoint.sh"]
    env_file:
      - .env.prod
    environment:
      BACKUP_ENV: prod
      BACKUP_CRON: ${BACKUP_CRON:-0 */3 * * *}
      RESTORE_TEST_CRON: ${RESTORE_TEST_CRON:-0 4 * * 0}
      BACKUP_VAULT_DIR: /vault-data
    volumes:
      - ./ops/backup:/opt/backup:ro
      - backup_metrics:/metrics
      - vault_data:/vault-data:ro
    networks:
      - db
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy once the tools are installed, the crontab is rendered and crond is running.
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/backup.env && pgrep crond >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Sessions + OTP. Every key carries a TTL, so volatile-lru can only ever drop expiring keys.
  # AOF everysec plus an RDB snapshot keep sessions across restarts (ADR-0017).
  session-redis:
    container_name: zenflow-cache-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "1800 1"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - cache
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Rate-limit counters only (ADR-0005): disposable, so LRU eviction + RDB snapshot
  # (every 15 s when >= 1 key changed) and no AOF. Keep separate from `session-redis`.
  redis-ratelimit:
    container_name: zenflow-cache-ratelimit-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "15 1"
      - --appendonly
      - "no"
    volumes:
      - redis_ratelimit_data:/data
    expose:
      - "6379"
    networks:
      - ratelimit
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Job queues (ADR-0007, BullMQ). Must NOT evict or lose jobs: noeviction + AOF on
  # its own volume. Keep separate from `session-redis` and `redis-ratelimit`.
  redis-queue:
    container_name: zenflow-cache-queue-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_queue_data:/data
    expose:
      - "6379"
    networks:
      - queue
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runtime kill switch (ADR-0008): flags + audit stream. noeviction + AOF so a
  # restart keeps every flag; its own volume. Shares the `queue` network (same
  # consumers: api, watcher, workers). Keep separate from every other Redis.
  redis-killswitch:
    container_name: zenflow-cache-killswitch-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_killswitch_data:/data
    expose:
      - "6379"
    networks:
      - queue
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SSE fan-out (ADR-0018): ephemeral pub/sub only, no persistence.
  redis-pubsub:
    container_name: zenflow-cache-pubsub-prod
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    networks:
      - pubsub
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Observability stack (see observability/README.md) --------------------
  # Receives OTLP/HTTP from the API (src/tracing.ts) and the bandit service on
  # :4318, fans traces -> Tempo, metrics -> Prometheus (scrape :8889),
  # logs -> Loki. .env.prod must set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318.
  otel-collector:
    container_name: zenflow-otel-collector-prod
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
    networks:
      - o11y
    depends_on:
      - tempo
      - loki

  # Traces. Metrics-generator remote-writes span metrics + the service graph
  # into Prometheus.
  tempo:
    container_name: zenflow-tempo-prod
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
    networks:
      - o11y

  # Logs. Fed by Alloy (container stdout) and by the collector (app OTLP logs).
  loki:
    container_name: zenflow-loki-prod
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - o11y

  # Ships every container's stdout/stderr to Loki, tagged by compose service.
  alloy:
    container_name: zenflow-alloy-prod
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - o11y
    depends_on:
      - loki

  # Metrics. Scrapes the collector (app), node-exporter (host), cAdvisor
  # (per-container), and accepts remote-write from Tempo.
  prometheus:
    container_name: zenflow-prometheus-prod
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage,native-histograms
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/scrape.d/redis-exporter.yml:/etc/prometheus/scrape.d/redis-exporter.yml:ro
      - ./observability/prometheus/rules.d/redis-sessions.yml:/etc/prometheus/rules.d/redis-sessions.yml:ro
      - ./observability/prometheus/rules.d/session-event-partitions.yml:/etc/prometheus/rules.d/session-event-partitions.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - o11y

  # Sessions Redis memory and evictions (Prometheus job `redis-exporter`, rules in
  # observability/prometheus/rules.d/redis-sessions.yml).
  redis-exporter:
    container_name: zenflow-redis-exporter-prod
    image: oliver006/redis_exporter:v1.67.0-alpine
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://session-redis:6379
    expose:
      - "9121"
    networks:
      - cache
      - o11y
    depends_on:
      session-redis:
        condition: service_healthy

  node-exporter:
    container_name: zenflow-node-exporter-prod
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backup_metrics:/textfile:ro
    expose:
      - "9100"
    networks:
      - o11y

  cadvisor:
    container_name: zenflow-cadvisor-prod
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - o11y

  # Dashboards + Explore. Bound to loopback only — reach it with an SSH tunnel
  # or put it behind nginx with auth. Anonymous access is OFF.
  grafana:
    container_name: zenflow-grafana-prod
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      # Internet-facing through nginx, so no default password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.alphatrann.com}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
      GF_LOG_LEVEL: warn
      # Server-side PNG rendering (panel/report exports, alert images).
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Alert email (provisioning/alerting/contact-points.yml) through Mailgun SMTP for the
      # alerts.alphatrann.com sending domain. Only GRAFANA_SMTP_PASSWORD (the domain's SMTP
      # credential) is required; EU region: GRAFANA_SMTP_HOST=smtp.eu.mailgun.org:587.
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.mailgun.org:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-postmaster@alerts.alphatrann.com}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-alerts@alerts.alphatrann.com}
      GF_SMTP_FROM_NAME: Zenflow alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # No published port: reached through nginx at https://grafana.alphatrann.com.
    expose:
      - "3000"
    networks:
      - o11y
    depends_on:
      - prometheus
      - tempo
      - loki

  grafana-renderer:
    container_name: zenflow-grafana-renderer-prod
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      RENDERING_MODE: default
    expose:
      - "8081"
    networks:
      - o11y

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    restart: unless-stopped
    # Reload periodically so renewed certificates are picked up (graceful).
    command: ["/bin/sh", "-c", "(while :; do sleep 12h; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Written by deploy.sh (active colour); a directory mount survives file replacement.
      - ./state:/etc/nginx/zenflow/state:ro
      - ./nginx/snippets-proxy.conf:/etc/nginx/zenflow/snippets-proxy.conf:ro
      - ./nginx/sse.conf:/etc/nginx/zenflow/sse.conf:ro
      - ./nginx/grafana.conf:/etc/nginx/zenflow/grafana.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - grafana
    networks:
      - edge
      - o11y

  # Renews the certificate over the nginx webroot. First issuance: nginx/init-cert.sh.
  certbot:
    image: certbot/certbot:v3.0.1
    container_name: certbot
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --authenticator webroot --webroot-path /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - edge

  storage:
    container_name: zenflow-storage-prod
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data
    expose:
      - "9000"
    volumes:
      - storage_data:/data
    env_file:
      - .env.prod
    networks:
      - storage

  # HashiCorp Vault (OSS, file storage). Secrets store for SECRETS_PROVIDER=vault;
  # see docs/ops/secrets.md. Starts sealed: init/unseal by hand after every restart.
  # Not reachable from other containers' networks and published on loopback only.
  vault:
    container_name: zenflow-vault-prod
    image: hashicorp/vault:1.20.4
    restart: unless-stopped
    # Config lives outside /vault/config: the image entrypoint already passes
    # -config=/vault/config for `server`, and a second file there duplicates the listener.
    command: ["server", "-config=/vault/custom/config.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./ops/vault/config.hcl:/vault/custom/config.hcl:ro
    networks:
      - vault
    healthcheck:
      # sealedcode/uninitcode=200 so a sealed or not-yet-initialised Vault still
      # counts as "process is up" (it must be unsealed by a human, not by compose).
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  db:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
  ratelimit:
    driver: bridge
    internal: true
  queue:
    driver: bridge
    internal: true
  pubsub:
    driver: bridge
    internal: true
  bandit:
    driver: bridge
  o11y:
    driver: bridge
  mail:
    driver: bridge
  storage:
    driver: bridge
    internal: true
  vault:
    driver: bridge

volumes:
  storage_data:
  postgres_data:
  letsencrypt:
  certbot_webroot:
  uploads:
  tempo_data:
  loki_data:
  alloy_data:
  prometheus_data:
  grafana_data:
  vault_data:
  redis_data:
  redis_ratelimit_data:
  redis_queue_data:
  backup_metrics:
  redis_killswitch_data:
