name: zenflow-dev
services:
  postgres:
    container_name: zenflow-db
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    env_file:
      - docker.dev.env
    networks:
      - db

  redis:
    container_name: zenflow-cache
    image: redis:8.8.0-alpine
    ports:
      - 6379:6379
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-cache-ratelimit
    image: redis:8.8.0-alpine
    ports:
      - 6380:6379
    networks:
      - cache

  mail:
    container_name: zenflow-mail
    image: mailhog/mailhog:v1.0.1
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - mail

  bandit:
    container_name: zenflow-bandit
    build: ../services/bandit
    ports:
      - "8100:8000"
    environment:
      # `obs` is the `zenflow-obs` network compose.observability.yml creates —
      # start that stack first (`docker compose -f compose.observability.yml
      # up -d`) or this container-to-container hostname won't resolve and the
      # SDK will just retry-and-drop every export (see .env.example for the
      # non-container case). `localhost` here is this container's own netns,
      # not the collector's — that was the bug: the OTLP endpoint was never
      # set, so the SDK fell back to a host nothing listens on.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - bandit
      - obs

networks:
  db:
    driver: bridge
  cache:
    driver: bridge
  mail:
    driver: bridge
  bandit:
    driver: bridge
  obs:
    external: true
    name: zenflow-obs

volumes:
  postgres_data:
