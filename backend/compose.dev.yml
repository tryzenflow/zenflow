name: zenflow-dev
services:
  postgres:
    container_name: zenflow-db
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    env_file:
      - docker.dev.env
    networks:
      - db

  redis:
    container_name: zenflow-cache
    image: redis:8.8.0-alpine
    ports:
      - 6379:6379
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-cache-ratelimit
    image: redis:8.8.0-alpine
    ports:
      - 6380:6379
    networks:
      - cache

  mail:
    container_name: zenflow-mail
    image: mailhog/mailhog:v1.0.1
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - mail

  bandit:
    container_name: zenflow-bandit
    build: ../services/bandit
    ports:
      - "8100:8000"
    networks:
      - bandit

networks:
  db:
    driver: bridge
  cache:
    driver: bridge
  mail:
    driver: bridge
  bandit:
    driver: bridge

volumes:
  postgres_data:
