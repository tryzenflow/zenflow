name: zenflow-dev
services:
  postgres:
    container_name: zenflow-db
    image: postgres:18.4-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    env_file:
      - .env.dev
    networks:
      - db

  redis:
    container_name: zenflow-cache
    image: redis:8.8.0-alpine
    ports:
      - 6379:6379
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-cache-ratelimit
    image: redis:8.8.0-alpine
    ports:
      - 6380:6379
    networks:
      - cache

  # Job queues (ADR-0007): noeviction + AOF so a restart keeps queued jobs.
  redis-queue:
    container_name: zenflow-cache-queue
    image: redis:8.8.0-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - 6381:6379
    volumes:
      - redis_queue_data:/data
    networks:
      - cache

  # SSE fan-out (ADR-0018): no persistence.
  redis-pubsub:
    container_name: zenflow-cache-pubsub
    image: redis:8.8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - 6382:6379
    networks:
      - cache

  bandit:
    container_name: zenflow-bandit
    build: ../services/bandit
    ports:
      - "8100:8000"
    networks:
      - bandit

  storage:
    container_name: zenflow-storage-dev
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    env_file:
      - .env.dev
    networks:
      - storage
    
  
  mail:
    container_name: zenflow-mail-dev
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mail

networks:
  db:
    driver: bridge
  storage:
    driver: bridge
  cache:
    driver: bridge
  mail:
    driver: bridge
  bandit:
    driver: bridge

volumes:
  postgres_data:
  redis_queue_data:
  storage_data:
