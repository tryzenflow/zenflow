# Staging / load-test stack.
#   docker compose --env-file .env.staging -f compose.staging.yml up -d --build
# (--env-file feeds the ${...} interpolation used by postgres-exporter.)
name: zenflow-staging
services:
  # HTTP only (ADR-0011); scheduled work runs in `watcher`, queue consumers in `worker-*`.
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:0.1.0-beta.0}
    expose:
      - "8000"
    networks:
      - edge
      - db
      - cache
      - ratelimit
      - queue
      - pubsub
      - bandit
      - mail
      - storage
      - o11y
      - upstream
    volumes:
      # Legacy local uploads; kept mounted only until scripts/migrate-files-to-s3.ts has run.
      - uploads:/app/uploads
    depends_on:
      storage:
        condition: service_started
      postgres:
        condition: service_healthy
      session-redis:
        condition: service_healthy
      redis-ratelimit:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-killswitch:
        condition: service_healthy
      redis-pubsub:
        condition: service_healthy
      mail:
        condition: service_started
      migrations:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env.staging
    environment:
      ROLE: api
      SWAGGER_ENABLED: "true"
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Pinned here, not left to .env.staging: a missing value would fall back to the REAL DLU hosts, and the load
      # test drives hundreds of synthetic accounts. These must only ever point at fake-dlu.
      QUEUE_REDIS_URL: redis://redis-queue:6379
      REDIS_KILLSWITCH_URL: redis://redis-killswitch:6379
      REDIS_PUBSUB_URL: redis://redis-pubsub:6379
      LMS_URL: http://fake-dlu:4100
      PORTAL_API_URL: http://fake-dlu:4100
      PORTAL_API_KEY: fake-portal-key
      # Load test knob: 0 = each placement runs exactly one algorithm (see scheduler/constants.ts). Prod leaves it unset (=1).
      PAIRWISE_SAMPLE_RATE: ${PAIRWISE_SAMPLE_RATE:-1}
    # Caps keep the load test fair: no service can starve the others on a big host.
    cpus: 4
    mem_limit: 4g
    deploy:
      replicas: 3

  # Queue roles (ADR-0007, ADR-0011). Each serves only GET /health on :5001.
  # `watcher` is the only cron runner (ingestion ticker, reminder sweep,
  # retained-sessions, matrix decay): exactly one replica. The consumers scale
  # independently (`replicas`), except that fetch concurrency is kept low to be
  # polite to DLU.
  # Enqueues work; consumes nothing.
  watcher:
    extends:
      service: api
    container_name: zenflow-watcher-staging
    restart: unless-stopped
    environment:
      ROLE: watcher
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes `portal-fetch`.
  worker-portal:
    extends:
      service: api
    container_name: zenflow-worker-portal-staging
    restart: unless-stopped
    environment:
      ROLE: worker-portal
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes `lms-fetch`.
  worker-lms:
    extends:
      service: api
    container_name: zenflow-worker-lms-staging
    restart: unless-stopped
    environment:
      ROLE: worker-lms
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consumes `notify`: push, email, reminders.
  worker-notify:
    extends:
      service: api
    container_name: zenflow-worker-notify-staging
    restart: unless-stopped
    environment:
      ROLE: worker-notify
      QUEUE_SHUTDOWN_TIMEOUT_MS: "50000"
    stop_grace_period: 60s
    deploy:
      replicas: 1
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Stand-in for lms.dlu.edu.vn / portal-api.dlu.edu.vn so ingestion can be load
  # tested without touching the real university. Any credentials work except the
  # password "wrongpass". Stats: GET /_/stats, reset: POST /_/reset.
  fake-dlu:
    container_name: zenflow-fake-dlu-staging
    image: node:24-alpine
    # Node 24 strips TypeScript types natively; the script has no dependencies.
    command: ["node", "/app/fake-dlu-server.ts"]
    environment:
      FAKE_DLU_PORT: "4100"
    volumes:
      - ./scripts/fake-dlu-server.ts:/app/fake-dlu-server.ts:ro
    expose:
      - "4100"
    networks:
      - upstream

  bandit:
    container_name: zenflow-bandit-staging
    build: ../services/bandit
    image: ${ZENFLOW_BANDIT_IMAGE:-zenflow-bandit:latest}
    expose:
      - "8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - bandit
      - o11y
    cpus: 2
    mem_limit: 2g

  migrations:
    container_name: zenflow-db-migration-staging
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:0.1.0-beta.0}
    networks:
      - db
      - egress
    command: pnpm prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.staging

  postgres:
    container_name: zenflow-db-staging
    image: postgres:18.4-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./observability/postgres/init-pg-stat-statements.sql:/docker-entrypoint-initdb.d/10-pg-stat-statements.sql:ro
    env_file:
      - .env.staging
    networks:
      - db
    cpus: 4
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate cron process (busybox crond): encrypted pg_dump to S3 plus a restore test.
  # Staging: short interval, backs up to MinIO.
  # Keys come from .env.staging: BACKUP_S3_*, BACKUP_AGE_RECIPIENT, BACKUP_AGE_IDENTITY. See docs/ops/backups.md.
  backup:
    container_name: zenflow-backup-staging
    image: postgres:18.4-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/opt/backup/entrypoint.sh"]
    env_file:
      - .env.staging
    environment:
      BACKUP_ENV: staging
      BACKUP_CRON: ${BACKUP_CRON:-*/15 * * * *}
      RESTORE_TEST_CRON: ${RESTORE_TEST_CRON:-7 * * * *}
      BACKUP_S3_ENDPOINT: http://storage:9000
      BACKUP_CREATE_BUCKET: "1"
      BACKUP_ON_START: "1"
      BACKUP_PRUNE_DAYS: ${BACKUP_PRUNE_DAYS:-1}
      BACKUP_VAULT_DIR: /vault-data
    volumes:
      - ./ops/backup:/opt/backup:ro
      - backup_metrics:/metrics
      - vault_data:/vault-data:ro
    networks:
      - db
      - storage
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy once the tools are installed, the crontab is rendered and crond is running.
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/backup.env && pgrep crond >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Sessions + OTP. Every key carries a TTL, so volatile-lru can only ever drop expiring keys.
  # AOF everysec plus an RDB snapshot keep sessions across restarts (ADR-0017).
  session-redis:
    container_name: zenflow-cache-staging
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "1800 1"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - cache
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Rate-limit counters only (ADR-0005): disposable, so LRU eviction + RDB snapshot
  # (every 15 s when >= 1 key changed) and no AOF. Keep separate from `session-redis`.
  redis-ratelimit:
    container_name: zenflow-cache-ratelimit-staging
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "15 1"
      - --appendonly
      - "no"
    volumes:
      - redis_ratelimit_data:/data
    expose:
      - "6379"
    networks:
      - ratelimit
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Job queues (ADR-0007, BullMQ). Must NOT evict or lose jobs: noeviction + AOF on
  # its own volume. Keep separate from `session-redis` and `redis-ratelimit`.
  redis-queue:
    container_name: zenflow-cache-queue-staging
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_queue_data:/data
    expose:
      - "6379"
    networks:
      - queue
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Runtime kill switch (ADR-0008): flags + audit stream. noeviction + AOF so a
  # restart keeps every flag; its own volume. Shares the `queue` network (same
  # consumers: api, watcher, workers). Keep separate from every other Redis.
  redis-killswitch:
    container_name: zenflow-cache-killswitch-staging
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_killswitch_data:/data
    expose:
      - "6379"
    networks:
      - queue
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # SSE fan-out (ADR-0018): ephemeral pub/sub only, no persistence.
  redis-pubsub:
    container_name: zenflow-cache-pubsub-staging
    image: redis:8.8.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    networks:
      - pubsub
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mail:
    container_name: zenflow-mail-staging
    image: axllent/mailpit:v1.31.4
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - mail

  # --- Observability stack (see observability/README.md) --------------------
  # Receives OTLP/HTTP from the API (src/tracing.ts) and the bandit service on
  # :4318, fans traces -> Tempo, metrics -> Prometheus (scrape :8889),
  # logs -> Loki. .env.prod must set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 (set on the api service below).
  otel-collector:
    container_name: zenflow-otel-collector-staging
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
    networks:
      - o11y
    depends_on:
      - tempo
      - loki

  # Traces. Metrics-generator remote-writes span metrics + the service graph
  # into Prometheus.
  tempo:
    container_name: zenflow-tempo-staging
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose:
      - "3200"
    networks:
      - o11y

  # Logs. Fed by Alloy (container stdout) and by the collector (app OTLP logs).
  loki:
    container_name: zenflow-loki-staging
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - o11y

  # Ships every container's stdout/stderr to Loki, tagged by compose service.
  alloy:
    container_name: zenflow-alloy-staging
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    networks:
      - o11y
    depends_on:
      - loki

  # Metrics. Scrapes the collector (app), node-exporter (host), cAdvisor
  # (per-container), and accepts remote-write from Tempo.
  prometheus:
    container_name: zenflow-prometheus-staging
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage,native-histograms
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/scrape.d/redis-exporter.yml:/etc/prometheus/scrape.d/redis-exporter.yml:ro
      - ./observability/prometheus/rules.d/redis-sessions.yml:/etc/prometheus/rules.d/redis-sessions.yml:ro
      - ./observability/prometheus/rules.d/session-event-partitions.yml:/etc/prometheus/rules.d/session-event-partitions.yml:ro
      - ./observability/prometheus/scrape.d/postgres-exporter.yml:/etc/prometheus/scrape.d/postgres-exporter.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - o11y

  # Sessions Redis memory and evictions (Prometheus job `redis-exporter`, rules in
  # observability/prometheus/rules.d/redis-sessions.yml).
  redis-exporter:
    container_name: zenflow-redis-exporter-staging
    image: oliver006/redis_exporter:v1.67.0-alpine
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://session-redis:6379
    expose:
      - "9121"
    networks:
      - cache
      - o11y
    depends_on:
      session-redis:
        condition: service_healthy

  node-exporter:
    container_name: zenflow-node-exporter-staging
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backup_metrics:/textfile:ro
    expose:
      - "9100"
    networks:
      - o11y

  # `cgroup: host`: on a cgroup v2 host cAdvisor otherwise runs in a private cgroup namespace and sees only its
  # own cgroup, so every container_* series for sibling containers comes back empty. It also needs the host's Docker
  # on the classic overlay2 graphdriver, not the containerd image store (`docker info` -> Driver Type
  # io.containerd.snapshotter.v1): there it cannot resolve a container's read-write layer and container_* series
  # carry no name/image label (Colima does this; the load test samples `docker stats` instead). Fix: set
  # {"features": {"containerd-snapshotter": false}} in /etc/docker/daemon.json and restart dockerd.
  cadvisor:
    container_name: zenflow-cadvisor-staging
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - o11y

  # Dashboards + Explore. Bound to loopback only — reach it with an SSH tunnel
  # or put it behind nginx with auth. Anonymous access is OFF.
  grafana:
    container_name: zenflow-grafana-staging
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://grafana.localhost}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
      GF_LOG_LEVEL: warn
      # Server-side PNG rendering (panel/report exports, alert images).
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Alert email goes to Mailpit (the `mail` service) in staging.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mail:1025
      GF_SMTP_FROM_ADDRESS: grafana@zenflow.local
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # No published port: reached through nginx at http://grafana.localhost.
    expose:
      - "3000"
    networks:
      - o11y
      - mail
    depends_on:
      - prometheus
      - tempo
      - loki

  grafana-renderer:
    container_name: zenflow-grafana-renderer-staging
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      RENDERING_MODE: default
    expose:
      - "8081"
    networks:
      - o11y

  # Postgres connections / locks / pg_stat_* for the load test (Prometheus job
  # `postgres-exporter`). The API's Prisma pool exposes no metrics of its own.
  postgres-exporter:
    container_name: zenflow-postgres-exporter-staging
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    # Interpolated by compose: run with `docker compose --env-file .env.staging ...`.
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    expose:
      - "9187"
    networks:
      - db
      - o11y
    depends_on:
      postgres:
        condition: service_healthy

  # Staging runs Vault only so the backup path (the vault_data snapshot) can be tested before prod; secrets
  # still come from .env.staging (SECRETS_PROVIDER=vault stays production-only).
  vault:
    container_name: zenflow-vault-staging
    image: hashicorp/vault:1.20.4
    restart: unless-stopped
    # Config lives outside /vault/config: the image entrypoint already passes
    # -config=/vault/config for `server`, and a second file there duplicates the listener.
    command: ["server", "-config=/vault/custom/config.hcl"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./ops/vault/config.hcl:/vault/custom/config.hcl:ro
    networks:
      - vault
    healthcheck:
      # sealedcode/uninitcode=200 so a sealed or not-yet-initialised Vault still
      # counts as "process is up" (it must be unsealed by a human, not by compose).
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.api.conf:/etc/nginx/zenflow/upstream.api.conf:ro
      - ./nginx/snippets-proxy.conf:/etc/nginx/zenflow/snippets-proxy.conf:ro
      - ./nginx/sse.conf:/etc/nginx/zenflow/sse.conf:ro
      - ./nginx/grafana.conf:/etc/nginx/zenflow/grafana.conf:ro
    depends_on:
      - api
      - grafana
    networks:
      - edge
      - o11y

  storage:
    container_name: zenflow-storage-staging
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data
    expose:
      - "9000"
    volumes:
      - storage_data:/data
    env_file:
      - .env.staging
    networks:
      - storage

