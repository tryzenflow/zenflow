name: zenflow-staging
services:
  api:
    container_name: zenflow-api-staging
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:2.1.0}
    expose:
      - "5000"
    networks:
      - edge
      - db
      - cache
      - ratelimit
      - bandit
      - mail
      - storage
    volumes:
      # Legacy local uploads; kept mounted only until scripts/migrate-files-to-s3.ts has run.
      - uploads:/app/uploads
    depends_on:
      storage:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-ratelimit:
        condition: service_started
      mail:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env.staging

  bandit:
    container_name: zenflow-bandit-staging
    build: ../services/bandit
    image: ${ZENFLOW_BANDIT_IMAGE:-zenflow-bandit:latest}
    expose:
      - "8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - bandit

  migrations:
    container_name: zenflow-db-migration-staging
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${ZENFLOW_API_IMAGE:-zenflow-api:2.1.0}
    networks:
      - db
      - egress
    command: pnpm prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.staging

  postgres:
    container_name: zenflow-db-staging
    image: postgres:18.4-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env.staging
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: zenflow-cache-staging
    image: redis:8.8.0-alpine
    expose:
      - "6379"
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-cache-ratelimit-staging
    image: redis:8.8.0-alpine
    expose:
      - "6379"
    networks:
      - ratelimit

  mail:
    container_name: zenflow-mail-staging
    image: mailhog/mailhog:v1.0.1
    expose:
      - "1025"
    ports:
      - 8025:8025
    networks:
      - mail

  caddy:
    image: caddy:2.11.4
    container_name: caddy-staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile
    depends_on:
      - api
    networks:
      - edge

  storage:
    container_name: zenflow-storage-staging
    image: alphatran/minio:latest
    # The bucket is created before the server starts (a top-level directory in
    # the data dir is a bucket), so it exists the moment the API can connect —
    # no init job and no create-if-missing logic in the app.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p "/data/$$S3_BUCKET" &&
        MINIO_ROOT_USER="$$S3_ACCESS_KEY_ID"
        MINIO_ROOT_PASSWORD="$$S3_SECRET_ACCESS_KEY"
        exec minio server /data
    expose:
      - "9000"
    volumes:
      - storage_data:/data
    env_file:
      - .env.staging
    networks:
      - storage

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  db:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
  ratelimit:
    driver: bridge
    internal: true
  bandit:
    driver: bridge
  mail:
    driver: bridge
  storage:
    driver: bridge
    internal: true

volumes:
  storage_data:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads:
