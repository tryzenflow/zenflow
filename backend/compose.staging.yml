name: zenflow-staging
services:
  api:
    container_name: zenflow-api-staging
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: zenflow-api:2.1.0
    expose:
      - "5000"
    networks:
      - edge
      - db
      - cache
      - ratelimit
      - bandit
      - mail
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-ratelimit:
        condition: service_started
      mail:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    env_file:
      - .env.staging

  bandit:
    container_name: zenflow-bandit-staging
    build: ../services/bandit
    expose:
      - "8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - bandit

  migrations:
    container_name: zenflow-db-migration-staging
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: zenflow-api:2.1.0
    networks:
      - db
      - egress
    command: pnpm prisma:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.staging

  postgres:
    container_name: zenflow-db-staging
    image: postgres:18.4-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - docker.staging.env
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: zenflow-cache-staging
    image: redis:8.8.0-alpine
    expose:
      - "6379"
    networks:
      - cache

  redis-ratelimit:
    container_name: zenflow-cache-ratelimit-staging
    image: redis:8.8.0-alpine
    expose:
      - "6379"
    networks:
      - ratelimit

  mail:
    container_name: zenflow-mail-staging
    image: mailhog/mailhog:v1.0.1
    expose:
      - "1025"
    ports:
      - 8025:8025
    networks:
      - mail

  caddy:
    image: caddy:2.11.4
    container_name: caddy-staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile
    depends_on:
      - api
    networks:
      - edge

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  db:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
  ratelimit:
    driver: bridge
    internal: true
  bandit:
    driver: bridge
  mail:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads:
