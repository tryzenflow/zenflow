# Staging reverse proxy: plain HTTP on :80 (no TLS).
# ADR-0010. Mounted as /etc/nginx/nginx.conf.
worker_processes auto;
worker_shutdown_timeout 5m;   # a reload drains open SSE streams instead of cutting them
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;
    proxy_read_timeout 60s;   # default for every proxied location; sse.conf and grafana.conf override

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    upstream api {
        include /etc/nginx/zenflow/upstream.api.conf;
        keepalive 32;
    }

    upstream grafana {
        server grafana:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Grafana at http://grafana.localhost (browsers resolve *.localhost to loopback).
    server {
        listen 80;
        server_name grafana.localhost;

        location / {
            include /etc/nginx/zenflow/grafana.conf;
        }
    }

    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/zenflow/sse.conf;

        location / {
            include /etc/nginx/zenflow/snippets-proxy.conf;
            proxy_pass http://api;
        }
    }
}
