# Included inside `upstream api { ... }`. The deploy script rewrites this file
# (blue-green, ADR-0013) and runs `nginx -s reload`.
server api:8000;
# `api` resolves to every replica (Docker DNS returns one A record each) and
# nginx balances across them. DNS is read at start/reload only, so reload after
# scaling `api` (the deploy script does).
