# Production reverse proxy: HTTP -> HTTPS redirect, TLS from certbot, HTTP/2.
# ADR-0010. Mounted as /etc/nginx/nginx.conf.
worker_processes auto;
worker_shutdown_timeout 5m;   # a reload drains open SSE streams instead of cutting them
events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    upstream api {
        include /etc/nginx/zenflow/upstream.api.conf;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # certbot webroot challenge; everything else goes to HTTPS.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name zenflow-api.alphatrann.com;

        ssl_certificate     /etc/letsencrypt/live/zenflow-api.alphatrann.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zenflow-api.alphatrann.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/zenflow/sse.conf;

        location / {
            include /etc/nginx/zenflow/snippets-proxy.conf;
            proxy_pass http://api;
        }
    }
}
