# Server-Sent Events: stream, never buffer, and keep the read open for hours.
location = /api/v1/notifications/stream {
    include /etc/nginx/zenflow/snippets-proxy.conf;
    proxy_pass http://api;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    add_header X-Accel-Buffering no always;
}
