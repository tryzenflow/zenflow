# Shared by the prod and staging MinIO console servers: proxy to the console (:9001), including its
# WebSocket. Needs `map $http_upgrade $connection_upgrade` and `upstream minio_console` from the
# including nginx.conf. The S3 API (:9000) is not exposed; the API proxies file downloads.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Console uploads and long-lived sockets: no body cap, no buffering.
client_max_body_size 0;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 300s;
proxy_pass http://minio_console;
