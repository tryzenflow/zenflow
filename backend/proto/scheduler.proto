syntax = "proto3";

package scheduler;

message Interval {
  int32 start = 1; // minutes since midnight
  int32 end = 2; // minutes since midnight
}

message Task {
  string id = 1;
  string title = 2;
  int32 duration = 3;
  int32 max_splits = 5;
  int32 deadline = 6;
  int32 energy = 7; // 1–3
  string category_id = 8;
  repeated Interval preferred_windows = 9;
  repeated ScheduledBlock scheduled_blocks = 10;
  Interval fixed_window = 11;
}

message ScheduledBlock {
  string task_id = 1;
  int32 split_index = 2;
  int32 start = 3;
  int32 end = 4;
}

message EnergyBlock {
  int32 energy = 1;
  Interval interval = 2;
}

message UserPreference {
  int32 min_gap_between_tasks = 2;
  repeated EnergyBlock energy_blocks = 3;
}

message ScheduleRequest {
  repeated Task tasks = 1;
  UserPreference user_preference = 2;
}

message ScheduleResponse {
  repeated ScheduledBlock scheduled_blocks = 1;
}

service SchedulerService {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
}
