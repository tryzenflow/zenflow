syntax = "proto3";

package scheduler;

message Interval {
  int32 start = 1; // minutes since midnight
  int32 end = 2; // minutes since midnight
}

message Task {
  string id = 1;
  string title = 2;
  int32 duration = 3;
  int32 max_splits = 5;
  int32 deadline = 6;
  int32 energy = 7; // 1–3
  string category_id = 8;
  repeated Event events = 10;
  Interval fixed_window = 11;
}

message Event {
  string task_id = 1;
  int32 split_index = 2;
  int32 start = 3;
  int32 end = 4;
}

message EnergyZone {
  int32 level = 1;
  Interval interval = 2;
}

message UserPreference {
  int32 break_minutes = 2;
  repeated EnergyZone energy_zones = 3;
}

message ScheduleRequest {
  repeated Task tasks = 1;
  int32 min_time = 2;
  UserPreference user_preference = 3;
}

message ScheduleResponse {
  repeated Event events = 1;
}

service SchedulerService {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
}
