syntax = "proto3";

package scheduler;

import "google/protobuf/timestamp.proto";

// ----- CORE MESSAGES -----

message Interval {
  int32 start = 1; // minutes since midnight
  int32 end = 2; // minutes since midnight
}

message Task {
  string id = 1;
  string title = 2;
  int32 duration = 3;
  int32 priority = 4;
  optional google.protobuf.Timestamp deadline = 5;
  int32 energy = 6; // 1–3
  string category_id = 7;
  repeated ScheduledBlock scheduled_blocks = 8;
}

message ScheduledBlock {
  optional string task_id = 1;
  int32 split_index = 2;
  int32 start = 3;
  int32 end = 4;
}

message EnergyBlock {
  int32 energy = 1;
  Interval interval = 2;
}

message UserPreference {
  repeated Interval available_hours = 1;
  int32 min_gap_between_tasks = 2;
  repeated EnergyBlock energy_blocks = 3;
}

// ----- REQUEST & RESPONSE -----

message ScheduleRequest {
  repeated Task tasks = 1;
  UserPreference user_preference = 2;
}

message ScheduleResponse {
  repeated ScheduledBlock schedules = 1;
}

// ----- SERVICE -----

service SchedulerService {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
}
