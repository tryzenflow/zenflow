syntax = "proto3";

package scheduler;
import "google/protobuf/timestamp.proto";

// ----- CORE MESSAGES -----

message Interval {
  int32 start = 1; // minutes since midnight
  int32 end   = 2; // minutes since midnight
}

message Task {
  string id            = 1;
  string title         = 2;
  int32 duration       = 3;
  int32 priority       = 4;

  optional int32 earliest_start = 6;
  optional int32 latest_end     = 7;
  google.protobuf.Timestamp deadline = 8;

  bool mandatory       = 9;
  int32 max_splits     = 11;

  int32 focus   = 12; // 1–3

  string category_id   = 13;

  repeated string prerequisites = 14;
}

message TaskSchedule {
  string task_id = 2;
  int32 split = 3;
  int32 start = 4;
  int32 end   = 5;
}

message FocusBlock {
  int32 level = 1;
  Interval interval  = 2;
}

message Constraints {
  repeated Interval available_hours = 1;
  int32 min_gap_between_tasks       = 2;
  repeated FocusBlock focus_blocks = 3;
  bool batch_similar_tasks          = 4;
  int32 max_daily_load              = 5;
}

// ----- REQUEST & RESPONSE -----

message ScheduleRequest {
  repeated Task tasks     = 1;      // ISO datetime;
  Constraints constraints = 2;
}

message ScheduleResponse {
  repeated TaskSchedule schedules = 1;
}

// ----- SERVICE -----

service SchedulerService {
  rpc Schedule (ScheduleRequest) returns (ScheduleResponse);
}
