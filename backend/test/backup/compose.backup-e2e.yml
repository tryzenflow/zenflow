# Self-contained stack for test/backup/backup.e2e-spec.ts: its own Postgres, MinIO and the real
# `backup` service (same image, scripts and entrypoint as staging/prod), on a private network with
# no published ports and no fixed container names, so it cannot clash with another stack.
# The spec runs it: `docker compose -p zenflow-backup-e2e -f test/backup/compose.backup-e2e.yml up -d`.
# Credentials are throwaway. The age keypair is generated by the spec on every run and passed in
# through the environment (BACKUP_AGE_RECIPIENT / BACKUP_AGE_IDENTITY), so no key is committed.
name: zenflow-backup-e2e
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-password
      POSTGRES_DB: zenflow
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d zenflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: alphatran/minio:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        MINIO_ROOT_USER=e2e-access
        MINIO_ROOT_PASSWORD=e2e-secret-key
        exec minio server /data
    networks: [storage]

  backup:
    image: postgres:18.4-alpine
    entrypoint: ["sh", "/opt/backup/entrypoint.sh"]
    environment:
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?generated by the spec}
      BACKUP_AGE_IDENTITY: ${BACKUP_AGE_IDENTITY:?generated by the spec}
      BACKUP_ENV: e2e
      # Every minute so the spec exercises the real crond path, not just the scripts.
      BACKUP_CRON: "* * * * *"
      RESTORE_TEST_CRON: "* * * * *"
      BACKUP_S3_ENDPOINT: http://storage:9000
      BACKUP_CREATE_BUCKET: "1"
      BACKUP_S3_BUCKET: zenflow-backups-e2e
      BACKUP_S3_ACCESS_KEY_ID: e2e-access
      BACKUP_S3_SECRET_ACCESS_KEY: e2e-secret-key
      BACKUP_VAULT_DIR: /vault-data
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-password
      POSTGRES_DB: zenflow
    volumes:
      - ../../ops/backup:/opt/backup:ro
      - ./vault-fixture:/vault-data:ro
    networks: [db, storage, egress]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/backup.env && pgrep crond >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 90

networks:
  db:
    internal: true
  storage:
    internal: true
  egress: {}
