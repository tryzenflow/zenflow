# Prometheus scrape config for the local Grafana stack.
#
# App metrics do NOT come straight from the API — they arrive as OTLP at the
# OpenTelemetry Collector, which re-exposes them in Prometheus format on :8889.
# Tempo's metrics-generator remote-writes span metrics + the service graph in
# (needs --web.enable-remote-write-receiver, set on the command line).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: zenflow-observability

scrape_configs:
  # --- application signals (OTLP -> collector -> here) ---------------------
  - job_name: otel-collector-app
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: otel-collector

  # --- the collector's own health ----------------------------------------
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # --- host USE (node-exporter) + per-container USE (cAdvisor) -----------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # --- the stack itself -------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
