# Prod only: each public host through nginx, which also reports TLS certificate expiry.
scrape_configs:
  - job_name: zenflow-public
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.usezenflow.com/api/v1/health/live
          - https://usezenflow.com/privacy
          - https://grafana.usezenflow.com/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
