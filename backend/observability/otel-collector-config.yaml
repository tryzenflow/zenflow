# OpenTelemetry Collector — the single OTLP hub for the stack.
#
# The NestJS API (src/tracing.ts) and the Python bandit service (services/bandit,
# src/otel.py) both push OTLP/HTTP here on :4318. This config fans the three
# signals out to the local Grafana stack:
#
#   traces  -> Tempo   (otlp/tempo, grpc :4317)
#   metrics -> Prometheus scrapes the exporter below on :8889
#   logs    -> Loki     (otlphttp/loki, native OTLP ingest) — only the app ever
#              starts sending OTLP logs; container stdout is shipped by Alloy.
#
# `debug` stays wired on every pipeline so `docker logs zenflow-otel-collector`
# still shows a one-line summary of what is flowing.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Stamp a namespace so every signal shares one filterable label in Grafana.
  resource:
    attributes:
      - key: service.namespace
        value: zenflow
        action: upsert

exporters:
  debug:
    verbosity: basic

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus scrapes this endpoint (see prometheus/prometheus.yml).
  # resource_to_telemetry_conversion turns service.name / service.version /
  # deployment.environment.name into labels so dashboards can filter by them.
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

  # Loki 3.x accepts OTLP directly at /otlp/v1/logs.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki, debug]
  telemetry:
    logs:
      level: warn
    metrics:
      # The collector's own metrics — Prometheus scrapes :8888.
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
