# Standalone Grafana observability stack — traces, metrics, logs.
#
#   docker compose -f compose.observability.yml up -d
#
# Then run the API locally with the SDK on and pointed at the collector:
#
#   $env:OTEL_SDK_DISABLED = "false"
#   $env:OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4318"
#   pnpm --filter backend build; node --require ./backend/dist/tracing.js backend/dist/main
#
# Grafana → http://localhost:3000  (anonymous, Admin — no login)
#   Dashboards: "Zenflow · API Overview" / "· Scheduler & Bandit" / "· Ingestion"
#   Explore → Tempo (traces) / Loki (logs) are pre-wired and cross-linked.
#
# Container stdout is shipped to Loki by Alloy via the container runtime socket.
# Override the host socket path for Podman/rootless:
#   $env:OBS_RUNTIME_SOCK = "/run/user/1000/podman/podman.sock"
#
# Everything here also lands in compose.prod.yml (same images + configs).

name: zenflow-obs

services:
  otel-collector:
    container_name: zenflow-obs-otel-collector
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape (app metrics)
    networks: [obs]
    depends_on: [tempo, loki]

  tempo:
    container_name: zenflow-obs-tempo
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo API (Grafana queries this)
    networks: [obs]

  loki:
    container_name: zenflow-obs-loki
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [obs]

  alloy:
    container_name: zenflow-obs-alloy
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${OBS_RUNTIME_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345" # Alloy UI (component graph / debug)
    networks: [obs]
    depends_on: [loki]

  prometheus:
    container_name: zenflow-obs-prometheus
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver # Tempo metrics-generator writes here
      - --enable-feature=exemplar-storage,native-histograms
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [obs]

  node-exporter:
    container_name: zenflow-obs-node-exporter
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks: [obs]

  cadvisor:
    container_name: zenflow-obs-cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    # On a cgroup v2 host, cAdvisor otherwise runs in its own private cgroup
    # namespace and can only see its own cgroup — every container_* series
    # for sibling containers comes back empty even though the target is up.
    #
    # Also needs the host's Docker daemon on the classic overlay2 graphdriver,
    # not the containerd-snapshotter image store Docker Engine defaults new
    # installs to (`docker info` → Driver Type: io.containerd.snapshotter.v1):
    # cAdvisor's Docker reader can't resolve a container's read-write layer
    # under that layout ("failed to identify the read-write layer ID ...") and
    # every container_* series comes back with no name/image label. Set
    # `{"features": {"containerd-snapshotter": false}}` in the host's
    # /etc/docker/daemon.json and restart dockerd if so.
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks: [obs]

  grafana:
    container_name: zenflow-obs-grafana
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceToMetrics
      GF_LOG_LEVEL: warn
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [obs]
    depends_on: [prometheus, tempo, loki]

  grafana-renderer:
    container_name: zenflow-obs-grafana-renderer
    image: grafana/grafana-image-renderer:3.11.6
    restart: unless-stopped
    environment:
      RENDERING_MODE: default
    expose:
      - "8081"
    networks: [obs]

networks:
  obs:
    driver: bridge
    name: zenflow-obs

volumes:
  tempo_data:
  loki_data:
  alloy_data:
  prometheus_data:
  grafana_data:
