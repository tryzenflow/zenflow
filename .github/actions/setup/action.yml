name: Setup workspace
description: Node + pnpm (cached) install, then build @zenflow/shared and @zenflow/core and generate the Prisma client.
inputs:
  node-version:
    description: Node.js version passed to setup-node (workspace default 20; mobile jobs need 22+ for expo)
    required: false
    default: "20"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build shared packages + generate Prisma client
      shell: bash
      run: |
        pnpm shared:build
        pnpm core:build
        pnpm --filter backend exec prisma generate
