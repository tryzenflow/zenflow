name: Bug report
description: Something is broken or behaves wrongly
labels: [hotfix]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, mobile, ml, infra, security, other]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: web/mobile, browser or OS, commit or version
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0-blocker, P1-high, P2-medium, P3-low]
      default: 2
    validations: { required: true }
