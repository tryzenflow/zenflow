name: Mobile E2E (Android)

# Nightly + release branch + manual trigger.
# Not on every PR — the emulator + dev-client build is expensive;
# run it nightly and gate releases instead.
on:
  schedule:
    - cron: "17 2 * * *" # 2:17 AM UTC nightly (off :00 to spread load)
  push:
    branches:
      - "release/**"
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_APP_ID: com.zenflow.app
  E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  android-e2e:
    name: Android smoke (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis:
        image: redis:8.8.0-alpine
        ports: ["6379:6379"]
      redis-ratelimit:
        image: redis:8.8.0-alpine
        ports: ["6380:6379"]
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ["1025:1025", "8025:8025"]

    steps:
      - uses: actions/checkout@v4

      # ── Detect Maestro flows ──────────────────────────────────────────
      - name: Detect Maestro flows
        id: flows
        run: |
          if [ -n "$(find mobile/maestro/flows -name '*.yaml' 2>/dev/null | head -1)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No mobile/maestro/flows/*.yaml found; skipping."
          fi

      - uses: ./.github/actions/setup
        if: steps.flows.outputs.present == 'true'

      # ── Backend test stack ────────────────────────────────────────────
      - name: Generate throwaway .env.test
        if: steps.flows.outputs.present == 'true'
        run: .github/scripts/write-test-env.sh backend/.env.test

      - name: Start Postgres + object storage
        if: steps.flows.outputs.present == 'true'
        working-directory: backend
        run: docker compose -f compose.test.yml up -d

      - name: Wait for Postgres
        if: steps.flows.outputs.present == 'true'
        working-directory: backend
        run: |
          for i in $(seq 1 30); do
            docker exec zenflow-test-db pg_isready -U ci -d zenflow-test && exit 0
            sleep 2
          done
          docker compose -f compose.test.yml logs postgres
          exit 1

      - name: Apply migrations
        if: steps.flows.outputs.present == 'true'
        working-directory: backend
        run: pnpm exec dotenv -e .env.test -- prisma migrate deploy

      - name: Start backend API
        if: steps.flows.outputs.present == 'true'
        working-directory: backend
        run: |
          pnpm build
          (pnpm exec dotenv -e .env.test -- env PORT=5000 node dist/main > ../api.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/api > /dev/null && exit 0
            sleep 2
          done
          cat ../api.log
          exit 1

      # ── Install Maestro ───────────────────────────────────────────────
      - name: Install Maestro CLI
        if: steps.flows.outputs.present == 'true'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ── JDK + Gradle ─────────────────────────────────────────────────
      - name: Set up JDK 17
        if: steps.flows.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        if: steps.flows.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Android emulator ──────────────────────────────────────────────
      - name: Enable KVM
        if: steps.flows.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        if: steps.flows.outputs.present == 'true'
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-default-x86_64-v1

      - name: Create AVD
        if: steps.flows.outputs.present == 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD created and cached"

      - name: Build and run Maestro smoke suite
        if: steps.flows.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # NOTE: the action splits `script` on newlines and runs each line as
          # its own `sh -c` in `working-directory` (default: the repo root), so
          # `cd` has no effect and every line must be self-contained — no `cd`,
          # no multi-line `for` blocks, no line continuations.
          working-directory: mobile
          script: |
            # 1. Generate the native android project if not present.
            npx expo prebuild --platform android --no-install

            # 2. Fail fast if prebuild ran anywhere but mobile/ — the repo root
            #    is also an expo project, so a wrong cwd silently succeeds with
            #    the wrong package name and leaves a stray /android behind.
            test -f android/gradlew || { echo "::error::prebuild did not generate mobile/android/gradlew"; exit 1; }

            # 3. Build the debug APK via Gradle (sh, so a lost exec bit on the
            #    freshly generated wrapper can't break the build).
            sh android/gradlew -p android assembleDebug -x lint --no-daemon

            # 4. Install the APK on the emulator.
            test -f android/app/build/outputs/apk/debug/app-debug.apk || { echo "::error::assembleDebug produced no APK"; exit 1; }
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk

            # 5. Start Metro in production-like mode (no dev menu, minified).
            #    Backgrounded with output redirected so nothing holds the step's
            #    stdout; there is no $! to kill because each line is its own shell.
            npx expo start --dev-client --no-dev --minify > /tmp/metro.log 2>&1 &

            # 6. Wait for Metro to be ready.
            for i in $(seq 1 60); do curl -fs http://localhost:8081/status >/dev/null 2>&1 && break; sleep 2; done

            # 7. Launch the app on the emulator.
            adb shell monkey -p "$MAESTRO_APP_ID" -c android.intent.category.LAUNCHER 1
            sleep 10

            # 8. Run P0 smoke suite via the orchestrator:
            #    reset → OTP request → MailHog fetch → seed → suite.
            #    The runner calls the backend from the host, so it needs the
            #    localhost URL while the app itself uses 10.0.2.2.
            E2E_API_URL=http://localhost:5000/api/v1 node maestro/scripts/run-suite.js smoke

            # 9. Stop Metro (the emulator teardown below stops the emulator).
            pkill -f "expo start" || true
        env:
          MAESTRO_APP_ID: ${{ env.MAESTRO_APP_ID }}
          E2E_EMAIL: mobile-e2e+${{ env.E2E_RUN_ID }}@example.test
          E2E_RUN_ID: ${{ env.E2E_RUN_ID }}
          EXPO_PUBLIC_API_URL: http://10.0.2.2:5000/api/v1
          MAILHOG_URL: http://localhost:8025
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000

      # ── Artifacts ─────────────────────────────────────────────────────
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-android
          path: |
            mobile/maestro-report.xml
            mobile/maestro/screenshots/
            mobile/maestro/recordings/
            api.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit report
        if: always() && steps.flows.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-junit
          path: mobile/maestro-report.xml
          if-no-files-found: ignore
          retention-days: 7

      # ── Teardown ──────────────────────────────────────────────────────
      - name: Dump compose logs on failure
        if: failure()
        working-directory: backend
        run: docker compose -f compose.test.yml logs --no-color

      - name: Tear down
        if: always()
        working-directory: backend
        run: docker compose -f compose.test.yml down -v

  # ═══════════════════════════════════════════════════════════════════════
  # iOS E2E (macos-latest)
  # ═══════════════════════════════════════════════════════════════════════
  # macOS runners lack Docker, so we install Postgres/Redis/MailHog via
  # Homebrew and run services natively. MinIO is replaced with local
  # filesystem storage (S3_ENDPOINT pointed at a local mock).
  # ═══════════════════════════════════════════════════════════════════════
  ios-e2e:
    name: iOS smoke (Maestro)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ── Detect Maestro flows ──────────────────────────────────────────
      - name: Detect Maestro flows
        id: flows
        run: |
          if [ -n "$(find mobile/maestro/flows -name '*.yaml' 2>/dev/null | head -1)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No mobile/maestro/flows/*.yaml found; skipping."
          fi

      - uses: ./.github/actions/setup
        if: steps.flows.outputs.present == 'true'

      # ── Native services via Homebrew ──────────────────────────────────
      - name: Install and start Postgres + Redis + MailHog
        if: steps.flows.outputs.present == 'true'
        run: |
          brew install postgresql@17 redis mailhog minio/stable/minio

          # Postgres
          brew services start postgresql@17
          for i in $(seq 1 30); do pg_isready && break; sleep 2; done
          createuser -s ci 2>/dev/null || true
          createdb -U ci zenflow-test 2>/dev/null || true

          # Redis (main cache on 6379)
          redis-server --port 6379 --daemonize yes
          # Redis (rate-limit on 6380)
          redis-server --port 6380 --daemonize yes

          # MailHog
          mailhog &
          sleep 2

          # MinIO (object storage)
          mkdir -p /tmp/minio-data/zenflow-test
          MINIO_ROOT_USER=ci MINIO_ROOT_PASSWORD=ci-secret-key \
            minio server /tmp/minio-data --address :9010 &
          sleep 2

      - name: Generate .env.test for macOS
        if: steps.flows.outputs.present == 'true'
        run: |
          cat > backend/.env.test <<'ENV'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci
          POSTGRES_DB=zenflow-test
          DATABASE_URL=postgresql://ci@localhost:5432/zenflow-test?schema=public
          CACHE_URL=redis://localhost:6379
          RATE_LIMIT_CACHE_URL=redis://localhost:6380
          CORS_ORIGIN=http://localhost:5173
          MAIL_TRANSPORT=smtp://localhost:1025
          MAIL_FROM=noreply@example.com
          SESSION_SECRET=ci-session-secret-for-ios-e2e-testing
          FILE_URL_SECRET=ci-file-url-secret-for-ios-e2e-testing
          COOKIE_SECURE=false
          COOKIE_SAMESITE=lax
          MASTER_LMS_ENCRYPTION_KEY_V1=ci-lms-key-placeholder-32-chars-xx
          MASTER_PORTAL_ENCRYPTION_KEY_V1=ci-portal-key-placeholder-32-chrs
          PORTAL_API_KEY=ci-portal-key
          S3_ENDPOINT=http://localhost:9010
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=ci
          S3_SECRET_ACCESS_KEY=ci-secret-key
          S3_BUCKET=zenflow-test
          INGESTION_ENABLED=false
          INGESTION_REQUEST_DELAY_MS=0
          OTEL_SDK_DISABLED=true
          NODE_ENV=test
          ENV

      - name: Apply migrations
        if: steps.flows.outputs.present == 'true'
        working-directory: backend
        run: pnpm exec dotenv -e .env.test -- prisma migrate deploy

      - name: Start backend API
        if: steps.flows.outputs.present == 'true'
        working-directory: backend
        run: |
          pnpm build
          (pnpm exec dotenv -e .env.test -- env PORT=5000 node dist/main > ../api.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/api > /dev/null && exit 0
            sleep 2
          done
          cat ../api.log
          exit 1

      # ── Install Maestro ───────────────────────────────────────────────
      - name: Install Maestro CLI
        if: steps.flows.outputs.present == 'true'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ── iOS simulator ─────────────────────────────────────────────────
      - name: Boot iOS simulator
        if: steps.flows.outputs.present == 'true'
        run: |
          # Use the latest available iPhone simulator
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime in sorted(data['devices'].keys(), reverse=True):
            if 'iOS' in runtime:
              for d in data['devices'][runtime]:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['udid'])
                  sys.exit(0)
          sys.exit(1)
          ")
          echo "Booting simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          echo "SIMCTL_UDID=$DEVICE" >> "$GITHUB_ENV"

      - name: Build and run Maestro smoke suite (iOS)
        if: steps.flows.outputs.present == 'true'
        run: |
          cd mobile

          # 1. Generate the native iOS project.
          npx expo prebuild --platform ios --no-install

          # 2. Install CocoaPods.
          cd ios && pod install && cd ..

          # 3. Build for simulator via xcodebuild.
          xcodebuild \
            -workspace ios/zenflow.xcworkspace \
            -scheme zenflow \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "id=$SIMCTL_UDID" \
            -derivedDataPath ios/build \
            build \
            | xcpretty || true

          # 4. Install the built app on the simulator.
          APP_PATH=$(find ios/build -name "*.app" -path "*/Debug-iphonesimulator/*" | head -1)
          xcrun simctl install "$SIMCTL_UDID" "$APP_PATH"

          # 5. Start Metro in production-like mode.
          npx expo start --dev-client --no-dev --minify &
          METRO_PID=$!

          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/status 2>/dev/null && break
            sleep 2
          done

          # 6. Launch the app.
          xcrun simctl launch "$SIMCTL_UDID" "$MAESTRO_APP_ID"
          sleep 10

          # 7. Run P0 smoke suite via the orchestrator:
          #    reset → OTP request → MailHog fetch → seed → suite.
          node maestro/scripts/run-suite.js smoke

          kill $METRO_PID 2>/dev/null || true
        env:
          MAESTRO_APP_ID: ${{ env.MAESTRO_APP_ID }}
          E2E_EMAIL: mobile-e2e+${{ env.E2E_RUN_ID }}@example.test
          E2E_RUN_ID: ${{ env.E2E_RUN_ID }}
          EXPO_PUBLIC_API_URL: http://localhost:5000/api/v1
          MAILHOG_URL: http://localhost:8025
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000

      # ── Artifacts ─────────────────────────────────────────────────────
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-ios
          path: |
            mobile/maestro-report.xml
            mobile/maestro/screenshots/
            mobile/maestro/recordings/
            api.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit report (iOS)
        if: always() && steps.flows.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-junit-ios
          path: mobile/maestro-report.xml
          if-no-files-found: ignore
          retention-days: 7
