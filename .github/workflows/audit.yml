name: Dependency audit

# Informational only: never a required check. Findings show up in the job
# summary; Dependabot opens the actual upgrade PRs.
on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths: [pnpm-lock.yaml, "**/package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pnpm audit (non-blocking)
        continue-on-error: true
        run: |
          {
            echo '## pnpm audit (prod deps, moderate+)'
            echo '```'
            pnpm audit --prod --audit-level moderate || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
