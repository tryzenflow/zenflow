name: Version & Release (beta)

# Changesets-driven, modelled on limitkit's release.yml:
#   1. Merging changesets to main opens/updates a "version packages" PR.
#   2. Merging that PR bumps every package (one fixed version), so the next run
#      of this workflow sees a version with no tag yet, builds the Android APK
#      and an unsigned iOS .ipa (for sideloading), and publishes a GitHub
#      *pre-release* vX.Y.Z-beta.N with both attached.
# Pre-releases never trigger the production deploy (release.yml skips them).

on:
  push:
    branches: [main]

concurrency:
  group: release-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    name: Version packages PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create or update the version PR
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: Is there an untagged version?
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.v.outputs.new }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      mobile: ${{ steps.m.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="$(node -p "require('./backend/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          # 0.0.0 is the pre-first-release placeholder; never publish it.
          if [ "$version" != "0.0.0" ] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version already released (or placeholder); nothing to publish."
          fi
      # Rebuild the native apps only when something that ends up in them changed
      # since the last release. The version bump itself touches every package's
      # package.json and CHANGELOG.md (fixed group), so those are excluded.
      - id: m
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev" HEAD -- mobile packages .github/workflows/mobile.yml \
              ':(exclude)**/package.json' ':(exclude)**/CHANGELOG.md'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mobile/ and packages/ unchanged since $prev; skipping the mobile build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build mobile artifacts
    needs: detect
    if: needs.detect.outputs.new == 'true' && needs.detect.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile.yml
    with:
      variant: release
      # Repository variable: the API the shipped app talks to (e.g. staging).
      api_url: ${{ vars.MOBILE_API_URL }}
      skip_e2e: true
      # Already tested in the PR that produced this commit.
      skip_tests: true

  release:
    name: Publish GitHub release
    needs: [detect, build]
    # `build` is skipped when mobile is unchanged; the release then carries no
    # app binaries (the previous release has them).
    if: >-
      !cancelled() && needs.detect.outputs.new == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: needs.build.result == 'success'
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # The fixed group gives every package the same entry; backend's is canonical.
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' backend/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See the package changelogs for $VERSION." > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          assets=""
          [ -d dist ] && assets="dist/zenflow-android.apk dist/zenflow-ios-unsigned.ipa"
          gh release create "v$VERSION" $assets \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md $flags

  # This repo is private; users get builds from the public tryzenflow/releases
  # repo. A separate job (not a step above) so a failure here can be re-run on its
  # own without trying to recreate the private release. It is a job in this
  # workflow, not a `release: published` trigger, because releases created with
  # GITHUB_TOKEN don't start other workflows.
  publish-public:
    name: Mirror the release to tryzenflow/releases
    needs: [detect, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Copy the release (notes and app files) to the public repo
        env:
          # Reads this repo's release.
          GH_TOKEN: ${{ github.token }}
          # Fine-grained PAT or GitHub App token with "Contents: read and write"
          # on tryzenflow/releases only. Unset = skip, so the workflow works before
          # the secret exists.
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          PUBLIC_REPO: tryzenflow/releases
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          if [ -z "$PUBLIC_RELEASES_TOKEN" ]; then
            echo "::notice::PUBLIC_RELEASES_TOKEN is not set; not mirroring v$VERSION."
            exit 0
          fi
          tag="v$VERSION"
          if GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release view "$tag" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "::notice::$tag already exists in $PUBLIC_REPO; nothing to do."
            exit 0
          fi
          shopt -s nullglob # a notes-only release leaves assets/ empty
          mkdir assets
          # A release with only notes has no assets, which `gh release download` reports as an error.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir assets || true
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # No app changes since the last build means no files on this release here
          # (the previous one keeps them), but a public release page should always
          # have downloads: reuse the newest earlier release that has some.
          if [ -z "$(ls -A assets)" ]; then
            from="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
              --jq "[.[] | select(.tag_name != \"$tag\") | select(.assets | length > 0)][0].tag_name // empty")"
            if [ -n "$from" ]; then
              gh release download "$from" --repo "$GITHUB_REPOSITORY" --dir assets
              printf '\n\nThe app files are the build from %s; the app did not change in this version.\n' "$from" >> notes.md
            fi
          fi
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          # shellcheck disable=SC2086
          GH_TOKEN="$PUBLIC_RELEASES_TOKEN" gh release create "$tag" assets/* \
            --repo "$PUBLIC_REPO" --title "$tag" --notes-file notes.md $flags
