name: Mobile

# Native builds + Maestro e2e for mobile/ (issue #79). Unit + component tests
# run on every PR through ci.yml and again here as a gate for the builds; this
# workflow is the slow, native half: PRs that touch mobile/ get a build-only
# check when labelled `build-mobile`; the e2e suite runs nightly, on
# release/** pushes and on demand.
# Not wired into ci.yml's `ci-ok` on purpose (macOS minutes, emulator flakiness).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "mobile/**"
      - "packages/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: ["release/**"]
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Ho_Chi_Minh
  workflow_call:
    inputs:
      variant:
        type: string
        default: release
      api_url:
        description: "API base URL baked into the build"
        type: string
        default: ""
      skip_e2e:
        description: "Build only (used by the release workflow)"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      variant:
        description: "e2e = cleartext build that talks to the emulator host API; release = plain build against api_url"
        type: choice
        options: [e2e, release]
        default: e2e
      api_url:
        description: "API base URL baked into the build (variant=release only)"
        type: string
        default: ""
      run_ios_e2e:
        description: "Also run the Maestro suite on an iOS simulator"
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin: Maestro's installer otherwise floats to latest.
  MAESTRO_VERSION: "2.11.0"
  # 10.0.2.2 is the Android emulator's alias for the runner host; the iOS
  # simulator shares the host network, so it uses localhost instead.
  ANDROID_E2E_API_URL: http://10.0.2.2:8000/api/v1
  IOS_E2E_API_URL: http://localhost:8000/api/v1

jobs:
  # Cheap gate: no point spending native-build minutes on a red tree.
  test:
    name: Unit + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm shared:build
      - run: pnpm --filter mobile test

  build-android:
    name: Build Android APK
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-mobile')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZENFLOW_E2E: ${{ inputs.variant == 'release' && '0' || '1' }}
      EXPO_PUBLIC_API_URL: ${{ inputs.variant == 'release' && inputs.api_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            [ "${{ inputs.variant }}" != "release" ] || echo "::warning::variant=release without api_url: falling back to the emulator-host URL, so this build will not reach a real API"
            echo "EXPO_PUBLIC_API_URL=$ANDROID_E2E_API_URL" >> "$GITHUB_ENV"
          fi
      - name: Prebuild (android/ is gitignored)
        working-directory: mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/zenflow-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: zenflow-android-apk
          path: dist/zenflow-android.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS simulator app
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-mobile')
    needs: test
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.variant == 'release' && inputs.api_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            [ "${{ inputs.variant }}" != "release" ] || echo "::warning::variant=release without api_url: falling back to localhost, so this build will not reach a real API"
            echo "EXPO_PUBLIC_API_URL=$IOS_E2E_API_URL" >> "$GITHUB_ENV"
          fi
      - name: Prebuild (ios/ is gitignored)
        working-directory: mobile
        run: pnpm exec expo prebuild --platform ios --clean
      - uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
      - name: Build for the simulator (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace Zenflow.xcworkspace -scheme Zenflow \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      # A simulator .app cannot be installed on a phone. A device/TestFlight
      # .ipa needs an Apple Developer account (certificate + provisioning
      # profile) - see docs/mobile/testing.md#ios-artifact-app-vs-ipa.
      - name: Zip the .app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/ios/build/Build/Products/Release-iphonesimulator/Zenflow.app \
            dist/zenflow-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: zenflow-ios-simulator-app
          path: dist/zenflow-ios-simulator.zip
          if-no-files-found: error

  e2e-android:
    name: Maestro e2e (Android emulator)
    if: github.event_name != 'pull_request' && inputs.variant != 'release' && !inputs.skip_e2e
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:8.8.0-alpine
        ports: ["6379:6379"]
      redis-ratelimit:
        image: redis:8.8.0-alpine
        ports: ["6380:6379"]
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v5
        with:
          name: zenflow-android-apk
          path: dist
      - name: Generate throwaway .env.test
        run: .github/scripts/write-test-env.sh backend/.env.test
      - name: Start Postgres + object storage
        working-directory: backend
        run: docker compose -f compose.test.yml up -d
      # Same boot sequence as ci.yml's frontend-e2e. The emulator reaches this
      # process at 10.0.2.2:8000, so it must listen on all interfaces.
      - name: Migrate and start the API
        working-directory: backend
        run: |
          for i in $(seq 1 30); do docker exec zenflow-test-db pg_isready -U ci -d zenflow-test && break; sleep 2; done
          pnpm exec dotenv -e .env.test -- prisma migrate deploy
          pnpm build
          (pnpm exec dotenv -e .env.test -- env PORT=8000 node dist/main > ../api.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://localhost:8000/api >/dev/null && exit 0; sleep 2; done
          cat ../api.log; exit 1
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash mobile/e2e/ci-android.sh
      - name: Upload screenshots, video and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-results
          path: |
            mobile/e2e/results
            api.log
          if-no-files-found: ignore

  e2e-ios:
    name: Maestro e2e (iOS simulator)
    if: >-
      github.event_name != 'pull_request' && !inputs.skip_e2e &&
      (github.event_name == 'push' || inputs.run_ios_e2e) &&
      inputs.variant != 'release'
    needs: build-ios
    runs-on: macos-latest
    timeout-minutes: 75
    continue-on-error: true # advisory until the Android suite has proven stable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v5
        with:
          name: zenflow-ios-simulator-app
          path: dist
      - name: Install Docker (colima) for the test stack
        run: |
          brew install colima docker docker-compose redis
          colima start
          brew services start redis
          docker run -d -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.31.4
      - name: Generate throwaway .env.test
        run: .github/scripts/write-test-env.sh backend/.env.test
      - name: Start Postgres + object storage, then the API
        working-directory: backend
        run: |
          docker compose -f compose.test.yml up -d
          for i in $(seq 1 30); do docker exec zenflow-test-db pg_isready -U ci -d zenflow-test && break; sleep 2; done
          pnpm exec dotenv -e .env.test -- prisma migrate deploy
          pnpm build
          (pnpm exec dotenv -e .env.test -- env PORT=8000 node dist/main > ../api.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://localhost:8000/api >/dev/null && exit 0; sleep 2; done
          cat ../api.log; exit 1
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot simulator and install the app
        run: |
          unzip -q dist/zenflow-ios-simulator.zip -d dist/app
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" dist/app/Zenflow.app
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run flows
        working-directory: mobile
        run: |
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 e2e-video.mp4 &
          rec=$!
          status=0
          pnpm e2e || status=$?
          kill -INT $rec || true
          mkdir -p e2e/results && mv e2e-video.mp4 e2e/results/ 2>/dev/null || true
          exit $status
      - name: Upload screenshots, video and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-results
          path: |
            mobile/e2e/results
            api.log
          if-no-files-found: ignore
