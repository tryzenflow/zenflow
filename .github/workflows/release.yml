name: Release (production)

# Production deploys are promotions, not rebuilds: publishing a GitHub Release
# for tag vX.Y.Z deploys the images that images.yml already built for that
# tag's commit. The "production" Environment's required reviewers gate it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    # Beta pre-releases (release-beta.yml) ship mobile artifacts only; they must
    # never promote images to production.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - id: sha
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          # Only release commits that are on main (i.e. passed required CI).
          git fetch origin main
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::Tag ${TAG_NAME} is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.resolve.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
