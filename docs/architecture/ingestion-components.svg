<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1300" font-family="Helvetica, Arial, sans-serif">
  <title>Zenflow — ingestion component diagram</title>
  <defs>
    <marker id="iArrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/>
    </marker>
    <marker id="iArrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F0B100"/>
    </marker>
    <marker id="iArrNeutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B2724" fill-opacity="0.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1300" fill="#FCFBFA"/>
  <text x="30" y="32" font-size="20" font-weight="700" fill="#2B2724">Zenflow — ingestion components</text>

  <!-- Panel IO-TOP -->
  <rect x="40" y="90" width="1420" height="420" rx="14" fill="none" stroke="#2B2724" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="116" font-size="13.5" font-weight="700" fill="#2B2724" opacity="0.8">Sync watchers driven by one rolling ticker</text>

  <!-- Row1: cron + schedule -->
  <rect x="90" y="150" width="260" height="80" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="220" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Rolling ticker</text>
  <text x="220" y="199" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">one-minute heartbeat</text>
  <text x="220" y="213" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">the only trigger for ingestion</text>

  <rect x="430" y="150" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="580" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Ingestion schedule</text>
  <text x="580" y="199" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">claims the most overdue</text>
  <text x="580" y="213" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">sync targets</text>

  <!-- Row2: watchers -->
  <rect x="90" y="280" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="230" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">DKHP discovery</text>
  <text x="230" y="332" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">registration history,</text>
  <text x="230" y="346" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">once per semester</text>

  <rect x="410" y="280" width="260" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="540" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Timetable watcher</text>
  <text x="540" y="332" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">needs discovery first</text>
  <text x="540" y="346" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">uses cache and fanout</text>

  <rect x="710" y="280" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="830" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Exam watcher</text>
  <text x="830" y="332" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">plain fetch</text>
  <text x="830" y="346" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">no cache, no fanout</text>

  <rect x="990" y="280" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1110" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">LMS watcher</text>
  <text x="1110" y="332" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">assignments and quizzes</text>
  <text x="1110" y="346" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">uses cache and fanout</text>

  <!-- Row3: clients -->
  <rect x="410" y="410" width="260" height="80" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="540" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Portal and DKHP client</text>
  <text x="540" y="459" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">decrypts credentials, fetches</text>

  <rect x="850" y="410" width="260" height="80" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="980" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">LMS client</text>
  <text x="980" y="459" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">decrypts credentials, fetches</text>

  <!-- Panel CORE -->
  <rect x="40" y="580" width="1420" height="140" rx="14" fill="none" stroke="#2B2724" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="606" font-size="13.5" font-weight="700" fill="#2B2724" opacity="0.8">Parsing and normalization</text>
  <rect x="560" y="630" width="380" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="750" y="658" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Parsers</text>
  <text x="750" y="675" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">portal, DKHP and LMS payloads into calendar blocks</text>

  <!-- Panel IO-BOTTOM -->
  <rect x="40" y="790" width="1420" height="400" rx="14" fill="none" stroke="#2B2724" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="816" font-size="13.5" font-weight="700" fill="#2B2724" opacity="0.8">Write-back and shared cache</text>

  <!-- Row5: materializer + conflicts -->
  <rect x="420" y="850" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="580" y="878" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2B2724">Materializer</text>
  <text x="580" y="895" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">writes calendar sessions behind</text>
  <text x="580" y="908" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">a confirm gate, and sends a</text>
  <text x="580" y="921" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">sync digest notification</text>

  <rect x="820" y="850" width="260" height="100" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="950" y="890" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Sync conflicts</text>
  <text x="950" y="907" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">flags clashes between sources</text>

  <!-- Row6: cache + fanout side path -->
  <rect x="150" y="1000" width="280" height="90" rx="8" fill="#F5F3F0" stroke="#F0B100" stroke-width="2"/>
  <text x="290" y="1030" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Occurrence cache</text>
  <text x="290" y="1047" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">shares one fetch across</text>
  <text x="290" y="1060" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">classmates</text>

  <rect x="470" y="1000" width="280" height="90" rx="8" fill="#F5F3F0" stroke="#F0B100" stroke-width="2"/>
  <text x="610" y="1030" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">Occurrence fanout</text>
  <text x="610" y="1047" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">pushes a live fetch's change</text>
  <text x="610" y="1060" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">to confirmed classmates</text>

  <!-- Arrows: primary pipeline (orange) -->
  <path d="M350,190 L430,190" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>

  <path d="M460,230 L460,255 L230,255 L230,280" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M530,230 L530,255 L540,255 L540,280" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M630,230 L630,255 L830,255 L830,280" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M700,230 L700,255 L1110,255 L1110,280" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <rect x="525" y="238" width="112" height="15" fill="#FCFBFA"/>
  <text x="581" y="249" text-anchor="middle" font-size="10" fill="#FF6900">claims due targets</text>

  <path d="M230,360 L230,385 L500,385 L500,410" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#iArrOrange)"/>
  <path d="M370,320 L410,320" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M540,360 L540,410" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M830,360 L830,385 L620,385 L620,410" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M1110,360 L1110,385 L1010,385 L1010,410" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#iArrOrange)"/>

  <path d="M500,490 L500,610 L700,610 L700,630" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <path d="M980,490 L980,610 L820,610 L820,630" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>

  <path d="M750,700 L750,775 L580,775 L580,850" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>
  <rect x="620" y="762" width="82" height="15" fill="#FCFBFA"/>
  <text x="661" y="773" text-anchor="middle" font-size="10.5" fill="#FF6900">parsed blocks</text>

  <path d="M740,900 L820,900" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#iArrOrange)"/>

  <!-- decision gate: watchers consult the cache before fetching -->
  <path d="M410,345 L380,345 L380,1000" fill="none" stroke="#2B2724" stroke-opacity="0.45" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#iArrNeutral)"/>
  <rect x="388" y="518" width="130" height="16" fill="#FCFBFA"/>
  <text x="393" y="530" font-size="10" fill="#2B2724" opacity="0.75">cache or live fetch</text>

  <!-- side path: cache + fanout into Materializer (amber, never a bulk write) -->
  <path d="M300,1000 L300,970 L500,970 L500,950" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#iArrAmber)"/>
  <path d="M610,1000 L610,975 L640,975 L640,950" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#iArrAmber)"/>
  <rect x="790" y="964" width="270" height="18" fill="#FCFBFA"/>
  <text x="800" y="977" font-size="11" fill="#F0B100" font-weight="600">changes always go through the materializer</text>
  <path d="M1230,320 L1270,320 L1270,1045 L750,1045" fill="none" stroke="#2B2724" stroke-opacity="0.45" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#iArrNeutral)"/>
  <rect x="1278" y="662" width="130" height="16" fill="#FCFBFA"/>
  <text x="1283" y="674" font-size="10" fill="#2B2724" opacity="0.75">cache or live fetch</text>

  <!-- legend -->
  <g transform="translate(40,1220)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#FF6900" stroke-width="2.5"/>
    <text x="42" y="4" font-size="11.5" fill="#2B2724">primary ingestion pipeline</text>
    <line x1="270" y1="0" x2="304" y2="0" stroke="#F0B100" stroke-width="2.25"/>
    <text x="312" y="4" font-size="11.5" fill="#2B2724">cache and fanout side path</text>
    <line x1="640" y1="0" x2="674" y2="0" stroke="#2B2724" stroke-opacity="0.45" stroke-width="1.75" stroke-dasharray="6 5"/>
    <text x="682" y="4" font-size="11.5" fill="#2B2724">cache or live fetch decision</text>
  </g>
  <text x="40" y="1262" font-size="11.5" fill="#2B2724" opacity="0.7">Every ingested change reaches the calendar through the materializer.</text>
</svg>
