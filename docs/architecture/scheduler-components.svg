<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1520" font-family="Helvetica, Arial, sans-serif">
  <title>Zenflow — scheduler component diagram</title>
  <defs>
    <marker id="sArrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/>
    </marker>
    <marker id="sArrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F0B100"/>
    </marker>
    <marker id="sArrNeutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B2724" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1520" fill="#FCFBFA"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#2B2724">Zenflow — scheduler components</text>

  <!-- Orchestration panel -->
  <rect x="40" y="80" width="1420" height="720" rx="14" fill="none" stroke="#2B2724" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="106" font-size="14.5" font-weight="700" fill="#2B2724" opacity="0.8">Orchestration</text>
  <text x="60" y="122" font-size="11" fill="#2B2724" opacity="0.65">gathers occupancy + bandit state, calls the Bandit service, persists the result</text>

  <!-- Row A: primary chain -->
  <rect x="90" y="150" width="170" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="175" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">SessionsService</text>
  <text x="175" y="200" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">starts placement</text>

  <rect x="300" y="150" width="210" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="405" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">TaskPlacementService</text>
  <text x="405" y="200" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">pass-through to PythonPlacer</text>

  <rect x="560" y="150" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="650" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">PythonPlacer</text>
  <text x="650" y="200" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">applies + persists</text>

  <rect x="790" y="150" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="905" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">PlacementGateway</text>
  <text x="905" y="198" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">occupancy lookup</text>
  <text x="905" y="213" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">+ builds PlaceRequest</text>

  <!-- Row B -->
  <rect x="620" y="330" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="725" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">ExperimentService</text>
  <text x="725" y="380" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">primaryPolicy 50/50 + pairwise</text>

  <rect x="950" y="330" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="1055" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">PlacementClient</text>
  <text x="1055" y="380" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">timeout / retry / breaker</text>

  <!-- Row C: fallback -->
  <rect x="790" y="500" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="885" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">FallbackPlacer</text>
  <text x="885" y="558" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">Python-down driver</text>

  <rect x="1030" y="500" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1155" y="536" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">HeuristicPlacer</text>
  <text x="1155" y="554" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">frozen, deterministic fallback</text>
  <text x="1155" y="569" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">slot scoring + series spreading</text>

  <!-- Row D: crons + feedback -->
  <rect x="90" y="680" width="205" height="90" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="192" y="712" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">RetainedSessionsService</text>
  <text x="192" y="730" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">@Cron EVERY_30_MINUTES</text>

  <rect x="360" y="680" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="475" y="718" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">SchedulingFeedbackService</text>
  <text x="475" y="736" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">MOVE / RETAINED reward</text>

  <rect x="630" y="680" width="250" height="90" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="755" y="712" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">MatrixDecayService</text>
  <text x="755" y="730" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">@Cron EVERY_DAY_AT_3AM</text>
  <text x="755" y="745" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">decays preference matrix</text>

  <!-- Bandit panel -->
  <rect x="40" y="850" width="1420" height="605" rx="16" fill="none" stroke="#FF6900" stroke-width="2.5"/>
  <text x="60" y="876" font-size="14.5" font-weight="700" fill="#FF6900">Bandit service — separate process, authoritative ranking (ADR-0003)</text>

  <!-- Endpoint boxes -->
  <rect x="280" y="910" width="400" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="480" y="940" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">POST /v1/place</text>
  <text x="480" y="958" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.7">heuristic + LinUCB slot-first + series spread + displacement</text>
  <text x="480" y="976" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.6">pure numpy, stateless</text>

  <rect x="800" y="910" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="940" y="940" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">POST /update</text>
  <text x="940" y="958" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.7">delayed reward → BanditArmState</text>
  <text x="940" y="976" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.6">pure numpy, stateless</text>

  <!-- Scoring sub-panel -->
  <rect x="340" y="1040" width="820" height="180" rx="12" fill="#F5F3F0" stroke="#FF6900" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="362" y="1066" font-size="13" font-weight="700" fill="#2B2724" opacity="0.85">Scoring</text>

  <rect x="370" y="1090" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="470" y="1122" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Context Vector</text>
  <text x="470" y="1140" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">builds the context vector</text>
  <text x="470" y="1154" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">(d = 7)</text>

  <rect x="610" y="1090" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="720" y="1130" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">Time-of-Day Arms</text>
  <text x="720" y="1148" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">arm bands + overlap rate</text>

  <rect x="870" y="1090" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1000" y="1122" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">LinUCB Slot Search</text>
  <text x="1000" y="1140" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">slot-first scan + tie-break</text>
  <text x="1000" y="1154" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">stability-weighted scoring</text>

  <!-- Supporting sub-panel -->
  <rect x="195" y="1260" width="1110" height="160" rx="12" fill="#F5F3F0" stroke="#2B2724" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="215" y="1286" font-size="13" font-weight="700" fill="#2B2724" opacity="0.85">Supporting logic</text>

  <rect x="225" y="1310" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="320" y="1346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Preference Matrix</text>
  <text x="320" y="1362" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">matrix + decay</text>

  <rect x="440" y="1310" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="535" y="1346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Displacement (EDF)</text>
  <text x="535" y="1362" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">EDF repack</text>

  <rect x="655" y="1310" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="750" y="1346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Series Spreading</text>
  <text x="750" y="1362" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">day windows</text>

  <rect x="870" y="1310" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="965" y="1346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Conflict Detection</text>
  <text x="965" y="1362" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">flags time-slot conflicts</text>

  <rect x="1085" y="1310" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1180" y="1346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">Reward Calculation</text>
  <text x="1180" y="1362" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">MOVE / RETAINED reward</text>

  <!-- Row A primary chain arrows -->
  <path d="M260,195 L300,195" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <path d="M510,195 L560,195" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <path d="M740,195 L790,195" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>

  <!-- PythonPlacer -> ExperimentService (policy assignment) -->
  <path d="M650,240 L650,260 L725,260 L725,330" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <rect x="639" y="252" width="98" height="15" fill="#FCFBFA"/>
  <text x="643" y="263" font-size="10" fill="#FF6900">policy assignment</text>

  <!-- PlacementGateway -> PlacementClient -->
  <path d="M905,240 L905,310 L1055,310 L1055,330" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <rect x="932" y="302" width="106" height="15" fill="#FCFBFA"/>
  <text x="936" y="313" font-size="10" fill="#FF6900">sends PlaceRequest</text>

  <!-- PlacementClient -> Bandit /v1/place (authoritative) -->
  <path d="M1110,410 L1110,430 L1370,430 L1370,890 L480,890 L480,910" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <rect x="1315" y="642" width="112" height="15" fill="#FCFBFA"/>
  <text x="1321" y="653" font-size="11" fill="#FF6900">POST /v1/place</text>

  <!-- PlacementClient -. down/breaker open .-> FallbackPlacer -->
  <path d="M1000,410 L1000,450 L885,450 L885,500" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#sArrNeutral)"/>
  <rect x="884" y="442" width="176" height="14" fill="#FCFBFA"/>
  <text x="972" y="453" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">breaker open / Python down</text>

  <!-- FallbackPlacer -> HeuristicPlacer -->
  <path d="M980,545 L1030,545" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>

  <!-- PythonPlacer -> SchedulingFeedbackService (delayed reward, MOVE) -->
  <path d="M600,240 L600,660 L475,660 L475,680" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#sArrAmber)"/>
  <rect x="536" y="442" width="130" height="15" fill="#FCFBFA"/>
  <text x="542" y="453" font-size="10" fill="#F0B100">delayed reward (MOVE)</text>

  <!-- RetainedSessionsService -> SchedulingFeedbackService -->
  <path d="M295,725 L360,725" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#sArrAmber)"/>
  <rect x="297" y="705" width="60" height="14" fill="#FCFBFA"/>
  <text x="327" y="715" text-anchor="middle" font-size="9.5" fill="#F0B100">RETAINED</text>

  <!-- SchedulingFeedbackService -> Bandit /update -->
  <path d="M475,770 L475,800 L940,800 L940,910" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#sArrAmber)"/>

  <!-- /v1/place -> scoring cluster (context vector, pipeline entry) -->
  <path d="M480,1000 L480,1070 L470,1070 L470,1090" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#sArrOrange)"/>

  <!-- /update -> Reward Calculation -->
  <path d="M1080,955 L1390,955 L1390,1355 L1275,1355" fill="none" stroke="#F0B100" stroke-width="2" marker-end="url(#sArrAmber)"/>

  <!-- LinUCB Slot Search -> supporting logic (series spreading, displacement, preference, conflicts) -->
  <path d="M1000,1200 L1000,1240 L750,1240 L750,1310" fill="none" stroke="#2B2724" stroke-opacity="0.5" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#sArrNeutral)"/>
  <rect x="808" y="1232" width="84" height="14" fill="#F5F3F0"/>
  <text x="850" y="1243" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">shared logic</text>

  <!-- legend -->
  <g transform="translate(40,1470)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#FF6900" stroke-width="2.5"/>
    <text x="42" y="4" font-size="11.5" fill="#2B2724">primary placement path</text>
    <line x1="240" y1="0" x2="274" y2="0" stroke="#F0B100" stroke-width="2.25"/>
    <text x="282" y="4" font-size="11.5" fill="#2B2724">delayed-reward feedback loop</text>
    <line x1="520" y1="0" x2="554" y2="0" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2"/>
    <text x="562" y="4" font-size="11.5" fill="#2B2724">supporting / fallback</text>
    <line x1="770" y1="0" x2="804" y2="0" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="812" y="4" font-size="11.5" fill="#2B2724">on breaker open / Python down</text>
  </g>
</svg>
