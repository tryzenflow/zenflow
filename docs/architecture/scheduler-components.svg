<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1350" font-family="Helvetica, Arial, sans-serif">
  <title>Zenflow — scheduler component diagram</title>
  <defs>
    <marker id="sArrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF6900"/>
    </marker>
    <marker id="sArrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F0B100"/>
    </marker>
    <marker id="sArrNeutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B2724" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1350" fill="#FCFBFA"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#2B2724">Zenflow — scheduler components (backend/src/scheduler/* + services/bandit/src/core/*)</text>

  <!-- IO panel -->
  <rect x="40" y="90" width="1180" height="560" rx="14" fill="none" stroke="#2B2724" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="116" font-size="14.5" font-weight="700" fill="#2B2724" opacity="0.8">scheduler/io — I/O layer (Prisma, clock, RNG)</text>

  <!-- Core panel -->
  <rect x="1250" y="90" width="250" height="560" rx="14" fill="none" stroke="#2B2724" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1270" y="116" font-size="13" font-weight="700" fill="#2B2724" opacity="0.8">scheduler/core</text>
  <text x="1270" y="132" font-size="11" fill="#2B2724" opacity="0.7">frozen fallback, pure</text>

  <!-- Row A: primary chain -->
  <rect x="80" y="150" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="165" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">SessionsService</text>
  <text x="165" y="197" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">sessions/</text>

  <rect x="290" y="150" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="385" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">TaskPlacementService</text>
  <text x="385" y="193" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">pass-through to PythonPlacer</text>

  <rect x="520" y="150" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="605" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">PythonPlacer</text>
  <text x="605" y="197" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">applies + persists</text>

  <rect x="730" y="150" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="825" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">PlacementGateway</text>
  <text x="825" y="197" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">builds PlaceRequest</text>

  <!-- Row B -->
  <rect x="390" y="270" width="160" height="70" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="470" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">day-load.ts</text>
  <text x="470" y="317" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">the only occupancy query</text>

  <rect x="610" y="270" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="705" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">ExperimentService</text>
  <text x="705" y="313" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">primaryPolicy 50/50 + pairwise</text>

  <rect x="830" y="270" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="925" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">PlacementClient</text>
  <text x="925" y="317" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">timeout / retry / breaker</text>

  <!-- Row C: fallback -->
  <rect x="610" y="390" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="700" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">FallbackPlacer</text>
  <text x="700" y="437" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">Python-down driver</text>

  <rect x="830" y="390" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="920" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">HeuristicPlacer</text>
  <text x="920" y="437" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">frozen TS heuristic</text>

  <!-- Row D: crons + feedback -->
  <rect x="80" y="530" width="220" height="70" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="190" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">RetainedSessionsService</text>
  <text x="190" y="577" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">@Cron EVERY_30_MINUTES</text>

  <rect x="340" y="530" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="450" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">SchedulingFeedbackService</text>
  <text x="450" y="577" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">MOVE / RETAINED reward</text>

  <rect x="600" y="530" width="220" height="70" rx="8" fill="#F5F3F0" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="710" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2724">MatrixDecayService</text>
  <text x="710" y="577" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.7">@Cron EVERY_DAY_AT_3AM</text>

  <!-- Core boxes -->
  <rect x="1280" y="230" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1375" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2B2724">slot-score.ts</text>
  <text x="1375" y="272" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">bestFreeSlot / slotPreferenceScore</text>

  <rect x="1280" y="370" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1375" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2B2724">series-spread.ts</text>
  <text x="1375" y="412" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">non-overlapping day windows</text>

  <rect x="1280" y="530" width="190" height="70" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1375" y="556" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2B2724">matrix-decay.ts</text>
  <text x="1375" y="572" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.7">preference decay</text>

  <!-- Bandit panel -->
  <rect x="40" y="740" width="1610" height="520" rx="16" fill="none" stroke="#FF6900" stroke-width="2.5"/>
  <text x="60" y="768" font-size="14.5" font-weight="700" fill="#FF6900">services/bandit — separate process, authoritative ranking (ADR-0003)</text>

  <!-- Endpoint boxes -->
  <rect x="300" y="800" width="400" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="500" y="830" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">POST /v1/place</text>
  <text x="500" y="848" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.7">heuristic + LinUCB slot-first + series spread + displacement</text>
  <text x="500" y="866" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.6">pure numpy, stateless</text>

  <rect x="900" y="800" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#FF6900" stroke-width="2"/>
  <text x="1050" y="830" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2724">POST /update</text>
  <text x="1050" y="848" text-anchor="middle" font-size="11" fill="#2B2724" opacity="0.7">delayed reward → BanditArmState</text>
  <text x="1050" y="866" text-anchor="middle" font-size="10.5" fill="#2B2724" opacity="0.6">pure numpy, stateless</text>

  <!-- Scoring sub-panel -->
  <rect x="90" y="930" width="820" height="290" rx="12" fill="#F5F3F0" stroke="#FF6900" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="112" y="956" font-size="13" font-weight="700" fill="#2B2724" opacity="0.85">src/core — scoring</text>

  <rect x="130" y="1010" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="215" y="1040" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">context_vector.py</text>
  <text x="215" y="1057" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">builds x, d = 7</text>

  <rect x="330" y="1010" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="415" y="1040" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">arms.py</text>
  <text x="415" y="1057" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">arm bands + overlap rate</text>

  <rect x="520" y="1010" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="620" y="1040" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">linucb_best_slot.py</text>
  <text x="620" y="1057" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">slot-first scan + tie-break</text>

  <rect x="750" y="1010" width="140" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="820" y="1040" text-anchor="middle" font-size="12" font-weight="700" fill="#2B2724">slot_score.py</text>
  <text x="820" y="1057" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">stability weight</text>

  <!-- Supporting sub-panel -->
  <rect x="940" y="930" width="690" height="290" rx="12" fill="#F5F3F0" stroke="#2B2724" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="960" y="956" font-size="13" font-weight="700" fill="#2B2724" opacity="0.85">src/core — supporting / shared</text>

  <rect x="960" y="1010" width="145" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1032" y="1040" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">preference.py</text>
  <text x="1032" y="1057" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">matrix + decay</text>

  <rect x="1125" y="1010" width="145" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1197" y="1040" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">displacement.py</text>
  <text x="1197" y="1057" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">EDF repack</text>

  <rect x="1290" y="1010" width="145" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1362" y="1040" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">series_spread.py</text>
  <text x="1362" y="1057" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">day windows</text>

  <rect x="1455" y="1010" width="145" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1527" y="1040" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">sync_conflicts.py</text>
  <text x="1527" y="1057" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">conflict detection</text>

  <rect x="1060" y="1110" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1145" y="1140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">reward.py</text>
  <text x="1145" y="1157" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">MOVE / RETAINED reward</text>

  <rect x="1250" y="1110" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1335" y="1140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">slot.py</text>
  <text x="1335" y="1157" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">grid + interval helpers</text>

  <rect x="1440" y="1110" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#E3DFDA" stroke-width="1.5"/>
  <text x="1525" y="1140" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2B2724">constants.py</text>
  <text x="1525" y="1157" text-anchor="middle" font-size="9" fill="#2B2724" opacity="0.7">scan / weight constants</text>

  <!-- Row A primary chain arrows -->
  <path d="M250,185 L290,185" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <path d="M480,185 L520,185" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <path d="M690,185 L730,185" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>

  <!-- PythonPlacer -> ExperimentService (policy assignment) -->
  <path d="M605,220 L605,245 L700,245 L700,270" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <rect x="608" y="233" width="98" height="15" fill="#FCFBFA"/>
  <text x="612" y="244" font-size="10" fill="#FF6900">policy assignment</text>

  <!-- PlacementGateway -> day-load.ts -->
  <path d="M780,220 L780,250 L470,250 L470,270" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>
  <rect x="560" y="240" width="88" height="14" fill="#FCFBFA"/>
  <text x="604" y="251" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">occupancy query</text>

  <!-- PlacementGateway -> PlacementClient -->
  <path d="M870,220 L870,250 L925,250 L925,270" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>

  <!-- PlacementClient -> Bandit /v1/place (authoritative) -->
  <path d="M1020,300 L1130,300 L1130,720 L500,720 L500,800" fill="none" stroke="#FF6900" stroke-width="2.5" marker-end="url(#sArrOrange)"/>
  <rect x="640" y="700" width="112" height="15" fill="#FCFBFA"/>
  <text x="646" y="711" font-size="11" fill="#FF6900">POST /v1/place</text>

  <!-- PlacementClient -. down/breaker open .-> FallbackPlacer -->
  <path d="M860,340 L860,365 L700,365 L700,390" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#sArrNeutral)"/>
  <rect x="642" y="352" width="176" height="14" fill="#FCFBFA"/>
  <text x="730" y="363" text-anchor="middle" font-size="10" fill="#2B2724" opacity="0.75">breaker open / Python down</text>

  <!-- FallbackPlacer -> HeuristicPlacer -->
  <path d="M790,425 L830,425" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>

  <!-- HeuristicPlacer -> day-load.ts (degraded occupancy query) -->
  <path d="M900,390 L900,360 L470,360 L470,340" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>

  <!-- HeuristicPlacer -> slot-score.ts (core) -->
  <path d="M1010,410 L1040,410 L1040,265 L1280,265" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>

  <!-- FallbackPlacer -> series-spread.ts (core) -->
  <path d="M700,460 L700,485 L1245,485 L1245,405 L1280,405" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>

  <!-- PythonPlacer -> SchedulingFeedbackService (delayed reward, MOVE) -->
  <path d="M560,220 L560,500 L450,500 L450,530" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#sArrAmber)"/>
  <rect x="480" y="382" width="130" height="15" fill="#FCFBFA"/>
  <text x="486" y="393" font-size="10" fill="#F0B100">delayed reward (MOVE)</text>

  <!-- RetainedSessionsService -> SchedulingFeedbackService -->
  <path d="M300,565 L340,565" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#sArrAmber)"/>
  <rect x="303" y="555" width="40" height="14" fill="#FCFBFA"/>
  <text x="323" y="565" text-anchor="middle" font-size="9.5" fill="#F0B100">RETAINED</text>

  <!-- MatrixDecayService -> matrix-decay.ts -->
  <path d="M820,565 L1280,565" fill="none" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" marker-end="url(#sArrNeutral)"/>

  <!-- SchedulingFeedbackService -> Bandit /update -->
  <path d="M450,600 L450,705 L1050,705 L1050,800" fill="none" stroke="#F0B100" stroke-width="2.25" marker-end="url(#sArrAmber)"/>
  <rect x="815" y="694" width="90" height="15" fill="#FCFBFA"/>
  <text x="820" y="705" font-size="11" fill="#F0B100">POST /update</text>

  <!-- /v1/place -> scoring cluster -->
  <path d="M500,890 L500,905 L215,905 L215,1010" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#sArrOrange)"/>

  <!-- /v1/place -> supporting cluster (heuristic path too) -->
  <path d="M650,890 L650,905 L1030,905 L1030,1010" fill="none" stroke="#FF6900" stroke-width="2" marker-end="url(#sArrOrange)"/>

  <!-- /update -> reward.py -->
  <path d="M925,890 L925,1150 L1060,1150" fill="none" stroke="#F0B100" stroke-width="2" marker-end="url(#sArrAmber)"/>

  <!-- scoring cluster -> supporting/shared (constants, slot helpers) -->
  <path d="M890,1050 L918,1050 L918,1205 L1440,1205 L1440,1190" fill="none" stroke="#2B2724" stroke-opacity="0.5" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#sArrNeutral)"/>
  <rect x="930" y="1197" width="120" height="14" fill="#F5F3F0"/>
  <text x="990" y="1208" text-anchor="middle" font-size="9.5" fill="#2B2724" opacity="0.7">shared helpers</text>

  <!-- legend -->
  <g transform="translate(40,1290)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#FF6900" stroke-width="2.5"/>
    <text x="42" y="4" font-size="11.5" fill="#2B2724">primary placement path</text>
    <line x1="240" y1="0" x2="274" y2="0" stroke="#F0B100" stroke-width="2.25"/>
    <text x="282" y="4" font-size="11.5" fill="#2B2724">delayed-reward feedback loop</text>
    <line x1="520" y1="0" x2="554" y2="0" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2"/>
    <text x="562" y="4" font-size="11.5" fill="#2B2724">supporting / fallback</text>
    <line x1="770" y1="0" x2="804" y2="0" stroke="#2B2724" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="812" y="4" font-size="11.5" fill="#2B2724">on breaker open / Python down</text>
  </g>
</svg>
