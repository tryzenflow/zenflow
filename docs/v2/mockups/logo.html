<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenflow — Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
  </head>
  <body>
    <div class="flex py-16 flex-col items-center text-center space-y-4">
      <div
        class="w-96 h-96 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-xs rounded-2xl flex items-center justify-center p-4 group hover:border-zinc-300 dark:hover:border-zinc-700 transition-all"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 100 100"
          fill="none"
          class="w-full h-full text-zinc-900 dark:text-zinc-50 transition-transform group-hover:scale-105 duration-300"
        >
          <path
            d="M20 20H80V80H20V20Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="opacity-10 dark:opacity-20"
          />

          <path
            d="M20 35H50C55.5228 35 60 39.4772 60 45V80"
            stroke="currentColor"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="opacity-40 dark:opacity-50"
          />
          <path
            d="M40 20V55C40 60.5228 44.4772 65 50 65H80"
            stroke="currentColor"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="opacity-70"
          />

          <rect
            x="52"
            y="32"
            width="16"
            height="16"
            rx="4"
            fill="#8200db"
            class="shadow-sm animate-pulse duration-[3000ms]"
          />
          <rect
            x="52"
            y="32"
            width="16"
            height="16"
            rx="4"
            stroke="#8200db"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
